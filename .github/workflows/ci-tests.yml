name: CI helper tests

on:
  pull_request:
    paths:
      - '.github/ci/**'
      - '.github/workflows/**'
      - '.resolver-plugins/**'
      - 'dns/bind/**'
      - 'net/dhcp-interface-ha/**'
      - 'Mk/**'
      - 'Scripts/**'
      - 'Templates/**'
      - 'scripts/**'
      - 'docs/package-repository/**'

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - name: Run all CI helper and workflow tests
        run: python -m pytest -q .github/ci/ci-tests
