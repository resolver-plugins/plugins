name: Package index

on:
  workflow_call:
    inputs:
      series:
        type: string
        required: true
      abi:
        type: string
        required: true
      component:
        type: string
        required: true
      current_tag:
        type: string
        required: true
      source_tag:
        type: string
        required: true
    secrets:
      RP_PKG_SIGNING_KEY:
        required: true
      RP_DISTRIBUTION_APP_PRIVATE_KEY:
        required: true
      RP_SYNC_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

env:
  REPOSITORY: resolver-plugins/repository
  FEED: pkg/${{ inputs.abi }}/${{ inputs.series }}/latest

defaults:
  run:
    shell: bash

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.select.outputs.changed }}
      freebsd_release: ${{ steps.environment.outputs.freebsd_release }}
      core_commit: ${{ steps.environment.outputs.core_commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      SERIES: ${{ inputs.series }}
      ABI: ${{ inputs.abi }}
      COMPONENT: ${{ inputs.component }}
      CURRENT_TAG: ${{ inputs.current_tag }}
    steps:
      - name: Select the current Releases the feed serves
        id: select
        run: |
          old="$RUNNER_TEMP/old.json"
          mkdir -p "$RUNNER_TEMP/channel"
          err=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPOSITORY/contents/$FEED/channel.json?ref=gh-pages" 2>&1 >"$old") || {
            case $err in *"HTTP 404"*) echo '{}' >"$old" ;; *) echo "$err"; exit 1 ;; esac
          }
          tags=$(jq -r --arg c "$COMPONENT" --arg t "$CURRENT_TAG" \
            '(.components // {}) + {($c): {current_tag: $t}} | to_entries[] | "\(.key)=\(.value.current_tag)"' "$old")
          comps='{}'
          while IFS== read -r name tag; do
            rel=$(gh release view "$tag" --repo "$REPOSITORY" --json assets 2>&1) || {
              case $rel in *"release not found"*) continue ;; *) echo "$rel"; exit 1 ;; esac
            }
            assets=$(jq -c '[.assets[].name]' <<<"$rel")
            version=null
            if jq -e 'any(.[]; . == "build-record.json")' <<<"$assets" >/dev/null; then
              version=$(gh release download "$tag" --repo "$REPOSITORY" --pattern build-record.json --output - | jq -c '.version')
            fi
            comps=$(jq -c --arg n "$name" --arg t "$tag" --argjson v "$version" --argjson a "$assets" \
              '.[$n] = {current_tag: $t, version: $v, packages: [$a[] | select(test("^.+-[0-9][^-]*\\.pkg$"))]}' <<<"$comps")
          done <<<"$tags"
          oldnames=$(jq -c '[(.components // {})[] | (.packages // []) | if type == "object" then keys else . end | .[]] | sort' "$old")
          newnames=$(jq -c '[.[].packages[]] | sort' <<<"$comps")
          jq -n --argjson c "$comps" --arg s "$SERIES" --arg a "$ABI" \
            '{schema: 4, series: $s, package_abi: $a, components: $c}' >"$RUNNER_TEMP/channel/channel.json"
          echo "changed=$([ "$oldnames" = "$newnames" ] && echo false || echo true)" >>"$GITHUB_OUTPUT"
      - name: Read the build environment from the published record
        id: environment
        if: steps.select.outputs.changed == 'true'
        run: |
          gh release download "$CURRENT_TAG" --repo "$REPOSITORY" --pattern build-record.json --output - |
            jq -r '"freebsd_release=\(.freebsd_release // error("freebsd_release missing"))",
                   "core_commit=\(.core_commit // error("core_commit missing"))"' >>"$GITHUB_OUTPUT"
      - if: steps.select.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: channel-${{ inputs.series }}-${{ github.run_id }}
          path: ${{ runner.temp }}/channel/channel.json
          retention-days: 1

  stage:
    needs: select
    if: needs.select.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SERIES: ${{ inputs.series }}
      CORE_COMMIT: ${{ needs.select.outputs.core_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: docs/package-repository
      - uses: actions/download-artifact@v4
        with:
          name: channel-${{ inputs.series }}-${{ github.run_id }}
          path: feed
      - name: Download the current archives
        run: |
          jq -r '.components[] | .current_tag as $t | .packages[] | "\($t) \(.)"' feed/channel.json |
            while read -r tag archive; do
              gh release download "$tag" --repo "$REPOSITORY" --pattern "$archive" --dir feed
            done
          cp docs/package-repository/resolver-plugins.pub feed/
      - name: Configure the OPNsense package repository
        run: |
          core="$RUNNER_TEMP/core"
          git init -q "$core"
          git -C "$core" remote add origin https://github.com/opnsense/core.git
          git -C "$core" fetch -q --depth 1 --filter=blob:none origin "$CORE_COMMIT"
          git -C "$core" checkout -q FETCH_HEAD -- src/etc/pkg
          mkdir -p .opnsense-pkg/repos
          sed -e 's|%%CORE_PACKAGESITE%%|https://pkg.opnsense.org|' -e "s|%%CORE_ABI%%|$SERIES|" \
            "$core/src/etc/pkg/repos/OPNsense.conf.shadow.in" > .opnsense-pkg/repos/OPNsense.conf
          cp "$core/src/etc/pkg/repos/FreeBSD.conf.shadow" .opnsense-pkg/repos/FreeBSD.conf
          cp -R "$core/src/etc/pkg/fingerprints" .opnsense-pkg/
      - name: Sign the catalogue in FreeBSD ${{ needs.select.outputs.freebsd_release }}
        uses: vmactions/freebsd-vm@v1
        env:
          RP_PKG_SIGNING_KEY: ${{ secrets.RP_PKG_SIGNING_KEY }}
        with:
          release: ${{ needs.select.outputs.freebsd_release }}
          arch: x86_64
          usesh: true
          copyback: true
          disable-cache: true
          envs: RP_PKG_SIGNING_KEY
          run: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos /usr/local/etc/pkg/fingerprints
            cp .opnsense-pkg/repos/* /usr/local/etc/pkg/repos/
            cp -R .opnsense-pkg/fingerprints/OPNsense /usr/local/etc/pkg/fingerprints/
            pkg-static install -fy -r OPNsense pkg
            umask 077
            key=$(mktemp)
            trap 'rm -f "$key"' EXIT
            printf '%s' "$RP_PKG_SIGNING_KEY" | base64 -d > "$key"
            pkg repo feed "$key"
            pkg -v > .pkg-version
      - name: Record the pkg version
        run: echo "Signed with pkg $(cat .pkg-version)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: feed-${{ inputs.series }}-${{ github.run_id }}
          path: feed
          retention-days: 1

  publish:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ vars.RP_DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.RP_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: resolver-plugins
          repositories: repository
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          repository: resolver-plugins/repository
          ref: gh-pages
          token: ${{ steps.token.outputs.token }}
          sparse-checkout: ${{ env.FEED }}
          path: pages
      - uses: actions/download-artifact@v4
        with:
          name: feed-${{ inputs.series }}-${{ github.run_id }}
          path: ${{ runner.temp }}/feed
      - name: Replace the feed directory in one commit
        working-directory: pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf "$FEED"
          mkdir -p "$FEED"
          cp -R "$RUNNER_TEMP/feed/." "$FEED/"
          git add -A -- "$FEED"
          if git diff --cached --quiet; then
            echo "Nothing to publish: $FEED already matches the staged feed."
            exit 0
          fi
          git commit -q -m "Index $FEED"
          git push origin HEAD:gh-pages

  readback:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: feed-${{ inputs.series }}-${{ github.run_id }}
          path: feed
      - name: Compare the public feed with the staged files
        run: |
          url="https://resolver-plugins.github.io/repository/$FEED"
          for attempt in $(seq 20); do
            ok=true
            while read -r f; do
              curl -fsS --retry 3 "$url/${f#feed/}" | cmp -s - "$f" || { ok=false; break; }
            done < <(find feed -type f)
            if $ok; then echo "Public feed matches on attempt $attempt."; exit 0; fi
            [ "$attempt" -lt 20 ] && sleep 30
          done
          echo "::error::The public feed at $url does not match the staged files"
          exit 1

  retain:
    needs: readback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERIES: ${{ inputs.series }}
      CURRENT_TAG: ${{ inputs.current_tag }}
      SOURCE_TAG: ${{ inputs.source_tag }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: distribution
        with:
          app-id: ${{ vars.RP_DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.RP_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: resolver-plugins
          repositories: repository
          permission-contents: write
      - uses: actions/create-github-app-token@v2
        id: sync
        with:
          client-id: ${{ vars.RP_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.RP_SYNC_APP_PRIVATE_KEY }}
          owner: resolver-plugins
          repositories: plugins
          permission-contents: write
      - name: Delete the release two versions back
        env:
          GH_TOKEN: ${{ steps.distribution.outputs.token }}
          SYNC_TOKEN: ${{ steps.sync.outputs.token }}
        run: |
          src=resolver-plugins/plugins
          prev() {
            [ -n "$1" ] || return 0
            gh release download "$1" -R "$REPOSITORY" --pattern build-record.json --output - 2>/dev/null |
              jq -r '.previous_tag // empty' || true
          }
          previous=$(prev "$CURRENT_TAG")
          dropped=$(prev "$previous")
          if [ -z "$dropped" ] || ! gh release view "$dropped" -R "$REPOSITORY" >/dev/null 2>&1; then
            echo "Nothing to retire"
            exit 0
          fi
          gh release delete "$dropped" -R "$REPOSITORY" --cleanup-tag --yes
          source_tag="${SOURCE_TAG//\{series\}/$SERIES}-${dropped#"$CURRENT_TAG"-}"
          if GH_TOKEN=$SYNC_TOKEN gh release view "$source_tag" -R "$src" >/dev/null 2>&1; then
            GH_TOKEN=$SYNC_TOKEN gh release delete "$source_tag" -R "$src" --yes
          fi
