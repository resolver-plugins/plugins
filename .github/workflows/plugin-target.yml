name: Plugin target

on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      source_directory:
        type: string
        required: true
      branch_prefix:
        type: string
        required: true
      current_tag:
        type: string
        required: true
      source_tag:
        type: string
        required: true
      series:
        type: string
        required: true
      purpose:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      follow_upstream:
        type: boolean
        required: true
      prerelease:
        type: boolean
        required: true
      pr:
        type: string
        default: ''
    secrets:
      RP_DISTRIBUTION_APP_PRIVATE_KEY:
        required: false
      RP_SYNC_APP_PRIVATE_KEY:
        required: false
      RP_PKG_SIGNING_KEY:
        required: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare ${{ inputs.component }} ${{ inputs.series }} (${{ inputs.purpose }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SERIES: ${{ inputs.series }}
      SOURCE_DIRECTORY: ${{ inputs.source_directory }}
      BRANCH_PREFIX: ${{ inputs.branch_prefix }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PURPOSE: ${{ inputs.purpose }}
    outputs:
      operation: ${{ steps.decide.outputs.operation || steps.candidate.outputs.operation }}
      reason: ${{ steps.decide.outputs.reason || steps.candidate.outputs.reason }}
      freebsd_release: ${{ steps.environment.outputs.freebsd_release }}
      tools_tag: ${{ steps.environment.outputs.tools_tag }}
      core_commit: ${{ steps.environment.outputs.core_commit }}
      plugins_commit: ${{ steps.environment.outputs.plugins_commit }}
      upstream_package_commit: ${{ steps.environment.outputs.upstream_package_commit }}
      abi: ${{ steps.environment.outputs.abi || steps.candidate.outputs.abi }}
      version: ${{ steps.candidate.outputs.version || steps.current.outputs.version }}
      previous_tag: ${{ steps.candidate.outputs.previous_tag || steps.current.outputs.previous_tag }}
      source_base: ${{ steps.base.outputs.source_base || steps.candidate.outputs.source_base }}
      prepared_sha: ${{ steps.version.outputs.prepared_sha || steps.candidate.outputs.prepared_sha }}
      artifact_run_id: ${{ steps.candidate.outputs.artifact_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v6
        if: inputs.purpose != 'promote'
        with:
          fetch-depth: 0

      - name: Check the active series
        id: active
        run: |
          series=$(git ls-remote --tags --refs https://github.com/opnsense/core.git | cut -f2 | sed -nE 's|^refs/tags/([0-9]+\.[0-9]+)(\.[0-9]+)?$|\1|p' | sort -urV)
          [ -n "$series" ] || { echo "::error::No final X.Y or X.Y.Z tags found in opnsense/core"; exit 1; }
          tools=$(git ls-remote --tags --refs https://github.com/opnsense/tools.git | cut -f2)
          active=
          for s in $series; do
            tag=$(echo "$tools" | sed -nE "s|^refs/tags/(${s//./[.]}(\.[0-9]+)?)$|\1|p" | sort -V | tail -n 1)
            [ -n "$tag" ] || continue
            err=$(gh api "repos/opnsense/tools/contents/config/$s/build.conf?ref=$tag" 2>&1 >/dev/null) && { active=$s; break; }
            case $err in
              *"HTTP 404"*) ;;
              *) echo "::error::Reading config/$s/build.conf at opnsense/tools tag $tag failed: $err"; exit 1 ;;
            esac
          done
          [ -n "$active" ] || { echo "::error::No opnsense/core series has an opnsense/tools tag with config/<series>/build.conf"; exit 1; }
          [ "$SERIES" = "$active" ] || { echo "::error::Series $SERIES is not the active series $active; only the active series builds"; exit 1; }

      - name: Resolve the upstream environment
        id: environment
        if: inputs.purpose != 'promote'
        run: |
          tools_tag=$(git ls-remote --tags --refs https://github.com/opnsense/tools.git | cut -f2 | sed -nE "s|^refs/tags/(${SERIES//./[.]}(\.[0-9]+)?)$|\1|p" | sort -V | tail -n 1)
          os=$(gh api -H 'Accept: application/vnd.github.raw' "repos/opnsense/tools/contents/config/$SERIES/build.conf?ref=$tools_tag" | sed -nE '/^OS\?=/{s/^OS\?=([0-9]+\.[0-9]+).*/\1/p;q}')
          core_commit=$(git ls-remote https://github.com/opnsense/core.git "refs/heads/stable/$SERIES" | cut -f1)
          if [ -z "$tools_tag" ] || [ -z "$os" ] || [ -z "$core_commit" ]; then
            echo "::error::Series $SERIES: need an opnsense/tools tag (got '$tools_tag') whose build.conf has OS?=X.Y (got '$os') and an opnsense/core stable/$SERIES head (got '$core_commit')"
            exit 1
          fi
          git fetch -q --no-tags https://github.com/opnsense/plugins.git "+refs/heads/stable/$SERIES:refs/remotes/upstream/stable/$SERIES"
          plugins_commit=$(git rev-parse "refs/remotes/upstream/stable/$SERIES")
          upstream_package_commit=$(git log -1 --format=%H "refs/remotes/upstream/stable/$SERIES" -- "$SOURCE_DIRECTORY")
          {
            echo "freebsd_release=$os"
            echo "abi=FreeBSD:${os%%.*}:amd64"
            echo "tools_tag=$tools_tag"
            echo "core_commit=$core_commit"
            echo "plugins_commit=$plugins_commit"
            echo "upstream_package_commit=$upstream_package_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Read the current Release
        id: current
        env:
          CURRENT_TAG: ${{ inputs.current_tag }}
        run: |
          current=${CURRENT_TAG//'{series}'/$SERIES}
          err=$RUNNER_TEMP/current.err
          if ! assets=$(gh release view "$current" --repo resolver-plugins/repository --json assets --jq '.assets[].name' 2>"$err"); then
            grep -q 'release not found' "$err" || { echo "::error::Reading Release $current failed: $(cat "$err")"; exit 1; }
            echo "version=${SERIES}_1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          archives=$(grep -E -- "-${SERIES//./[.]}_[0-9]+\.pkg$" <<< "$assets" || true)
          if [ -z "$archives" ]; then
            echo "version=${SERIES}_1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ "$(wc -l <<< "$archives")" -eq 1 ] || { echo "::error::Release $current has more than one ${SERIES}_<n> archive: $archives"; exit 1; }
          revision=${archives%.pkg}; revision=${revision##*_}
          current_version=${SERIES}_$revision
          if grep -qx 'build-record.json' <<< "$assets"; then
            gh release download "$current" --repo resolver-plugins/repository --pattern build-record.json --dir "$RUNNER_TEMP/current"
            {
              echo "previous_tag=$current-$current_version"
              jq -r '"recorded_base=\(.source_base)", "recorded_commit=\(.source_commit)", "recorded_upstream=\(.upstream_package_commit)"' "$RUNNER_TEMP/current/build-record.json"
            } >> "$GITHUB_OUTPUT"
          fi
          {
            echo "current_version=$current_version"
            echo "version=${SERIES}_$((revision + 1))"
          } >> "$GITHUB_OUTPUT"

      - name: Find the candidate
        id: candidate
        if: inputs.purpose == 'promote'
        env:
          NAME: qualified-${{ inputs.component }}-${{ inputs.series }}-${{ inputs.source_sha }}
          CURRENT_VERSION: ${{ steps.current.outputs.current_version }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME" --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          [ -n "$run_id" ] || { echo "::error::No unexpired $NAME; request a production build (gh workflow run <entry> -f series=$SERIES)"; exit 1; }
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$NAME" --dir "$RUNNER_TEMP/candidate"
          record=$RUNNER_TEMP/candidate/build-record.json
          version=$(jq -r .version "$record")
          if [ -n "$CURRENT_VERSION" ] && [ "${version##*_}" -le "${CURRENT_VERSION##*_}" ]; then
            echo "::error::Candidate $version is not newer than current $CURRENT_VERSION; request a production build (-f series=$SERIES)"
            exit 1
          fi
          {
            echo "operation=promote"
            echo "reason=Promote candidate $version built from $SOURCE_SHA"
            echo "artifact_run_id=$run_id"
            jq -r '"version=\(.version)", "previous_tag=\(.previous_tag // "")", "prepared_sha=\(.source_commit)", "source_base=\(.source_base)", "abi=\(.abi)"' "$record"
          } >> "$GITHUB_OUTPUT"

      - name: Select the release branch base
        id: base
        if: inputs.purpose != 'promote'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base=refs/remotes/origin/$BRANCH_PREFIX/$SERIES
          if git show-ref --verify -q "$base"; then
            new_series=false
          else
            previous=$({ git for-each-ref --format='%(refname:lstrip=-1)' "refs/remotes/origin/$BRANCH_PREFIX/*"; echo "$SERIES"; } |
              sed -nE '/^[0-9]+\.[0-9]+$/p' | sort -V | awk -v s="$SERIES" '$0 == s { exit } { p = $0 } END { print p }')
            [ -n "$previous" ] || { echo "::error::Series $SERIES has no $BRANCH_PREFIX/$SERIES branch and no earlier $BRANCH_PREFIX/<series> branch to start from"; exit 1; }
            base=refs/remotes/origin/$BRANCH_PREFIX/$previous
            new_series=true
          fi
          git checkout -q --detach "$base"
          {
            echo "new_series=$new_series"
            echo "source_base=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Merge upstream stable/${{ inputs.series }}
        id: merge
        if: inputs.purpose != 'promote' && (steps.base.outputs.new_series == 'true' || (inputs.follow_upstream && steps.environment.outputs.upstream_package_commit != steps.current.outputs.recorded_upstream))
        run: |
          makefile=$SOURCE_DIRECTORY/Makefile
          if ! git -c merge.conflictStyle=merge merge --no-edit -m "Merge upstream stable/$SERIES into $BRANCH_PREFIX/$SERIES" "upstream/stable/$SERIES"; then
            # Version-line rule: a conflict confined to the PLUGIN_VERSION and PLUGIN_REVISION
            # lines of the Makefile keeps the release side; the version commit rewrites both.
            if [ "$(git diff --name-only --diff-filter=U)" != "$makefile" ] ||
              ! awk '/^<<<<<<< / { h = 1; n++; next }
                h == 1 && /^=======$/ { h = 2; next }
                h == 2 && /^>>>>>>> / { h = 0; next }
                h && !/^PLUGIN_(VERSION|REVISION)=/ { bad = 1; exit }
                h != 2
                END { exit bad || !n }' "$makefile" > "$RUNNER_TEMP/Makefile"; then
              echo "::error::Merging upstream stable/$SERIES conflicts beyond the version lines of $makefile"
              exit 1
            fi
            mv "$RUNNER_TEMP/Makefile" "$makefile"
            git add -- "$makefile"
            git commit -q --no-edit --cleanup=strip
          fi

      - name: Carry master changes
        id: carry
        if: inputs.purpose != 'promote'
        run: |
          last=$(git log -1 --grep='^Master-Commit: ' --format='%(trailers:key=Master-Commit,valueonly)' HEAD)
          [ -n "$last" ] || { echo "::error::No Master-Commit trailer on the release branch history"; exit 1; }
          git fetch -q --no-tags origin "$last" "$SOURCE_SHA"
          patch=$RUNNER_TEMP/carry.patch
          git diff --binary "$last" "$SOURCE_SHA" -- "$SOURCE_DIRECTORY" ":(exclude)$SOURCE_DIRECTORY/tests" > "$patch"
          if [ ! -s "$patch" ]; then
            echo "carried=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          makefile=$SOURCE_DIRECTORY/Makefile
          if ! git -c merge.conflictStyle=merge apply --3way "$patch"; then
            # Version-line rule: a conflict confined to the PLUGIN_VERSION and PLUGIN_REVISION
            # lines of the Makefile keeps the release side; the version commit rewrites both.
            if [ "$(git diff --name-only --diff-filter=U)" != "$makefile" ] ||
              ! awk '/^<<<<<<< / { h = 1; n++; next }
                h == 1 && /^=======$/ { h = 2; next }
                h == 2 && /^>>>>>>> / { h = 0; next }
                h && !/^PLUGIN_(VERSION|REVISION)=/ { bad = 1; exit }
                h != 2
                END { exit bad || !n }' "$makefile" > "$RUNNER_TEMP/Makefile"; then
              echo "::error::Carrying master $last..$SOURCE_SHA conflicts beyond the version lines of $makefile"
              exit 1
            fi
            mv "$RUNNER_TEMP/Makefile" "$makefile"
            git add -- "$makefile"
          fi
          echo "carried=true" >> "$GITHUB_OUTPUT"

      - name: Decide the operation
        id: decide
        if: inputs.purpose != 'promote'
        env:
          CARRIED: ${{ steps.carry.outputs.carried }}
          SOURCE_BASE: ${{ steps.base.outputs.source_base }}
          RECORDED_BASE: ${{ steps.current.outputs.recorded_base }}
          RECORDED_COMMIT: ${{ steps.current.outputs.recorded_commit }}
          CURRENT_VERSION: ${{ steps.current.outputs.current_version }}
        run: |
          if [ "$PURPOSE" = production ] && [ "$CARRIED" = false ] && [ "$(git rev-parse HEAD)" = "$SOURCE_BASE" ] &&
            { [ "$SOURCE_BASE" = "$RECORDED_COMMIT" ] || [ "$SOURCE_BASE" = "$RECORDED_BASE" ]; }; then
            operation=skip
            reason="Nothing changed since $CURRENT_VERSION"
          else
            operation=build
            reason="Build $SOURCE_DIRECTORY $PURPOSE for $SERIES from $SOURCE_SHA"
          fi
          {
            echo "operation=$operation"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"

      - name: Set the version and bundle the prepared source
        id: version
        if: steps.decide.outputs.operation == 'build'
        env:
          VERSION: ${{ steps.current.outputs.version }}
          SOURCE_BASE: ${{ steps.base.outputs.source_base }}
        run: |
          sed -i -E -e "s/^(PLUGIN_VERSION=[[:space:]]*).*/\1${VERSION%_*}/" \
            -e "s/^(PLUGIN_REVISION=[[:space:]]*).*/\1${VERSION##*_}/" "$SOURCE_DIRECTORY/Makefile"
          git add -A -- "$SOURCE_DIRECTORY"
          git commit -q -m "Set $SOURCE_DIRECTORY to $VERSION" -m "Master-Commit: $SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/source"
          git bundle create "$RUNNER_TEMP/source/source.bundle" HEAD "^$SOURCE_BASE"
          echo "prepared_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.operation == 'build'
        with:
          name: source-${{ inputs.component }}-${{ inputs.series }}-${{ github.run_id }}
          path: ${{ runner.temp }}/source/source.bundle
          retention-days: 1

  build:
    name: Build ${{ inputs.component }} ${{ needs.prepare.outputs.version }}
    needs: prepare
    if: needs.prepare.outputs.operation == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SERIES: ${{ inputs.series }}
      SOURCE_DIRECTORY: ${{ inputs.source_directory }}
      PREPARED_SHA: ${{ needs.prepare.outputs.prepared_sha }}
      CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: source-${{ inputs.component }}-${{ inputs.series }}-${{ github.run_id }}
          path: ${{ runner.temp }}/source

      - name: Check out the prepared source
        run: |
          git fetch -q "$RUNNER_TEMP/source/source.bundle" HEAD
          git checkout -q --detach "$PREPARED_SHA"

      - name: Configure the OPNsense package repository
        run: |
          core="$RUNNER_TEMP/core"
          git init -q "$core"
          git -C "$core" remote add origin https://github.com/opnsense/core.git
          git -C "$core" fetch -q --depth 1 --filter=blob:none origin "$CORE_COMMIT"
          git -C "$core" checkout -q FETCH_HEAD -- src/etc/pkg
          mkdir -p .opnsense-pkg/repos
          sed -e 's|%%CORE_PACKAGESITE%%|https://pkg.opnsense.org|' -e "s|%%CORE_ABI%%|$SERIES|" \
            "$core/src/etc/pkg/repos/OPNsense.conf.shadow.in" > .opnsense-pkg/repos/OPNsense.conf
          cp "$core/src/etc/pkg/repos/FreeBSD.conf.shadow" .opnsense-pkg/repos/FreeBSD.conf
          cp -R "$core/src/etc/pkg/fingerprints" .opnsense-pkg/

      - name: Build in FreeBSD ${{ needs.prepare.outputs.freebsd_release }}
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ needs.prepare.outputs.freebsd_release }}
          arch: x86_64
          usesh: true
          copyback: true
          disable-cache: true
          envs: SERIES SOURCE_DIRECTORY PREPARED_SHA
          run: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos /usr/local/etc/pkg/fingerprints
            cp .opnsense-pkg/repos/* /usr/local/etc/pkg/repos/
            cp -R .opnsense-pkg/fingerprints/OPNsense /usr/local/etc/pkg/fingerprints/
            pkg-static install -fy -r OPNsense pkg
            pkg install -y -r OPNsense opnsense
            make -C "$SOURCE_DIRECTORY" PLUGIN_DEVEL= PLUGIN_ABI="$SERIES" PLUGIN_HASH="$PREPARED_SHA" package
            mkdir .build
            cp "$SOURCE_DIRECTORY"/work/pkg/*.pkg .build/
            pkg query -F .build/*.pkg '%n|%o|%v|%q' > .build/identity
            pkg -v > .build/pkg-version

      - name: Write the build record
        env:
          FREEBSD_RELEASE: ${{ needs.prepare.outputs.freebsd_release }}
          SOURCE_BASE: ${{ needs.prepare.outputs.source_base }}
          MASTER_COMMIT: ${{ inputs.source_sha }}
          TOOLS_TAG: ${{ needs.prepare.outputs.tools_tag }}
          PLUGINS_COMMIT: ${{ needs.prepare.outputs.plugins_commit }}
          UPSTREAM_PACKAGE_COMMIT: ${{ needs.prepare.outputs.upstream_package_commit }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          IFS='|' read -r package origin version abi < .build/identity
          jq -n \
            --arg package "$package" --arg origin "$origin" --arg version "$version" --arg abi "$abi" \
            --arg series "$SERIES" --arg freebsd_release "$FREEBSD_RELEASE" \
            --arg source_base "$SOURCE_BASE" --arg master_commit "$MASTER_COMMIT" \
            --arg source_commit "$PREPARED_SHA" --arg control_commit "$GITHUB_WORKFLOW_SHA" \
            --arg tools_tag "$TOOLS_TAG" --arg core_commit "$CORE_COMMIT" \
            --arg plugins_commit "$PLUGINS_COMMIT" --arg upstream_package_commit "$UPSTREAM_PACKAGE_COMMIT" \
            --arg pkg_version "$(cat .build/pkg-version)" --arg previous_tag "$PREVIOUS_TAG" \
            --arg run_url "$RUN_URL" '$ARGS.named' > .build/build-record.json

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.component }}-${{ inputs.series }}-${{ github.run_id }}
          path: |
            .build/*.pkg
            .build/build-record.json
          retention-days: 1

  qualify:
    name: Qualify ${{ inputs.component }} ${{ needs.prepare.outputs.version }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SERIES: ${{ inputs.series }}
      CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ inputs.component }}-${{ inputs.series }}-${{ github.run_id }}
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: source-${{ inputs.component }}-${{ inputs.series }}-${{ github.run_id }}
          path: dist

      - name: Configure the OPNsense package repository
        run: |
          core="$RUNNER_TEMP/core"
          git init -q "$core"
          git -C "$core" remote add origin https://github.com/opnsense/core.git
          git -C "$core" fetch -q --depth 1 --filter=blob:none origin "$CORE_COMMIT"
          git -C "$core" checkout -q FETCH_HEAD -- src/etc/pkg
          mkdir -p .opnsense-pkg/repos
          sed -e 's|%%CORE_PACKAGESITE%%|https://pkg.opnsense.org|' -e "s|%%CORE_ABI%%|$SERIES|" \
            "$core/src/etc/pkg/repos/OPNsense.conf.shadow.in" > .opnsense-pkg/repos/OPNsense.conf
          cp "$core/src/etc/pkg/repos/FreeBSD.conf.shadow" .opnsense-pkg/repos/FreeBSD.conf
          cp -R "$core/src/etc/pkg/fingerprints" .opnsense-pkg/

      - name: Read the expected identity
        run: |
          echo "EXPECTED=$(jq -r '[.package, .origin, .version, .abi] | join("|")' dist/build-record.json)" >> "$GITHUB_ENV"

      - name: Install on a clean FreeBSD ${{ needs.prepare.outputs.freebsd_release }}
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ needs.prepare.outputs.freebsd_release }}
          arch: x86_64
          usesh: true
          disable-cache: true
          envs: EXPECTED
          run: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos /usr/local/etc/pkg/fingerprints
            cp .opnsense-pkg/repos/* /usr/local/etc/pkg/repos/
            cp -R .opnsense-pkg/fingerprints/OPNsense /usr/local/etc/pkg/fingerprints/
            pkg-static install -fy -r OPNsense pkg
            pkg install -y -r OPNsense opnsense
            install -d -m 0750 /conf
            install -m 0640 /usr/local/etc/config.xml /conf/config.xml
            sh /usr/local/etc/rc.subr.d/php
            service configd onestart
            /usr/local/opnsense/service/template_ctl.py OPNsense/WebGui
            pkg repo dist
            printf 'candidate: {\n  url: "file://%s/dist",\n  signature_type: "none",\n  enabled: yes\n}\n' "$PWD" \
              > /usr/local/etc/pkg/repos/candidate.conf
            pkg update -f
            name=${EXPECTED%%|*}
            pkg install -y "$name"
            pkg check -s "$name"
            test "$(pkg query '%n|%o|%v|%q' "$name")" = "$EXPECTED"
            test "${EXPECTED##*|}" = "$(pkg config ABI)"

      - uses: actions/upload-artifact@v4
        with:
          name: qualified-${{ inputs.component }}-${{ inputs.series }}-${{ inputs.source_sha }}
          path: |
            dist/*.pkg
            dist/build-record.json
            dist/source.bundle
          retention-days: 30

  publish:
    name: Publish ${{ inputs.component }} ${{ needs.prepare.outputs.version }}
    needs: [prepare, qualify]
    if: >-
      !cancelled() && inputs.purpose != 'candidate' && needs.prepare.result == 'success' &&
      (needs.qualify.result == 'success' || needs.prepare.outputs.operation == 'promote')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.versioned.outputs.created == 'true' || steps.current.outputs.advanced == 'true' }}
      current_tag: ${{ steps.current.outputs.current_tag }}
    env:
      REPOSITORY: resolver-plugins/repository
      SERIES: ${{ inputs.series }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PREPARED_SHA: ${{ needs.prepare.outputs.prepared_sha }}
      CURRENT_TAG: ${{ inputs.current_tag }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qualified-${{ inputs.component }}-${{ inputs.series }}-${{ inputs.source_sha }}
          path: dist
          run-id: ${{ needs.prepare.outputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ vars.RP_DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.RP_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: resolver-plugins
          repositories: repository
          permission-contents: write

      - name: Publish the versioned Release
        id: versioned
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: echo "::error::Not implemented (stage 04.1)" && exit 1

      - name: Advance the current Release
        id: current
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: echo "::error::Not implemented (stage 04.1)" && exit 1

  sync-source:
    name: Sync ${{ inputs.component }} ${{ needs.prepare.outputs.version }} source
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: ${{ inputs.branch_prefix }}/${{ inputs.series }}
      SERIES: ${{ inputs.series }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PREPARED_SHA: ${{ needs.prepare.outputs.prepared_sha }}
      SOURCE_TAG: ${{ inputs.source_tag }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          client-id: ${{ vars.RP_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.RP_SYNC_APP_PRIVATE_KEY }}
          owner: resolver-plugins
          repositories: plugins
          permission-contents: write

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - uses: actions/download-artifact@v4
        with:
          name: qualified-${{ inputs.component }}-${{ inputs.series }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/dist
          run-id: ${{ needs.prepare.outputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Push the prepared commit and its tag
        run: echo "::error::Not implemented (stage 04.2)" && exit 1

      - name: Create the source Release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: echo "::error::Not implemented (stage 04.2)" && exit 1

  index:
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.publish.outputs.published == 'true' }}
    concurrency:
      group: package-repository-index
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/package-index.yml
    with:
      series: ${{ inputs.series }}
      abi: ${{ needs.prepare.outputs.abi }}
      component: ${{ inputs.component }}
      current_tag: ${{ needs.publish.outputs.current_tag }}
      source_tag: ${{ inputs.source_tag }}
    secrets:
      RP_PKG_SIGNING_KEY: ${{ secrets.RP_PKG_SIGNING_KEY }}
      RP_DISTRIBUTION_APP_PRIVATE_KEY: ${{ secrets.RP_DISTRIBUTION_APP_PRIVATE_KEY }}
      RP_SYNC_APP_PRIVATE_KEY: ${{ secrets.RP_SYNC_APP_PRIVATE_KEY }}
