name: WAN HA DHCP controller tests

on:
  push:
    paths:
      - 'net/wan-ha-dhcp/**'
      - '.github/workflows/wan-ha-dhcp-tests.yml'
  pull_request:
    paths:
      - 'net/wan-ha-dhcp/**'
      - '.github/workflows/wan-ha-dhcp-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Python compile and unit tests
        run: |
          python -m compileall -q net/wan-ha-dhcp/src/opnsense/scripts/wan_ha_dhcp
          python -m unittest discover -s net/wan-ha-dhcp/tests -v
      - name: PHP syntax lint
        run: |
          find net/wan-ha-dhcp/src -type f \( -name '*.php' -o -name '*.inc' \) -print0 |
            xargs -0 -n1 php -l
      - name: Package and service shell lint
        run: |
          sh -n net/wan-ha-dhcp/+PRE_DEINSTALL.pre
          sh -n net/wan-ha-dhcp/+POST_DEINSTALL.post
          find net/wan-ha-dhcp/src/etc/rc.d net/wan-ha-dhcp/src/etc/rc.syshook.d net/wan-ha-dhcp/src/etc/rc.carp_service_status.d -type f -print0 | xargs -0 -n1 sh -n
          shellcheck -s sh -e SC1091 net/wan-ha-dhcp/+PRE_DEINSTALL.pre net/wan-ha-dhcp/+POST_DEINSTALL.post
          find net/wan-ha-dhcp/src/etc/rc.d net/wan-ha-dhcp/src/etc/rc.syshook.d net/wan-ha-dhcp/src/etc/rc.carp_service_status.d -type f -exec shellcheck -s sh -e SC1091 {} +
