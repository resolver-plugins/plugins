name: Remove closed pull request package releases

on:
  pull_request_target:
    types: [closed]
    paths:
      - 'dns/bind/**'
      - '!dns/bind/tests/**'
      - '!dns/bind/README.md'
      - 'net/dhcp-interface-ha/**'
      - '!net/dhcp-interface-ha/tests/**'
      - '!net/dhcp-interface-ha/README.md'
      - 'packages/*/Makefile'

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Remove development package releases
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 .github/ci/shared/release_channel.py cleanup-pull-request \
            --repository "$GITHUB_REPOSITORY" --pull-number "$PULL_NUMBER"
