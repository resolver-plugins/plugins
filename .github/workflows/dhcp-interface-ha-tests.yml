name: DHCP Interface HA controller tests

on:
  push:
    paths:
      - 'net/dhcp-interface-ha/**'
      - '.github/workflows/dhcp-interface-ha-tests.yml'
      - '.github/workflows/dhcp-interface-ha-release.yml'
      - '.github/ci/build-dhcp-interface-ha.sh'
      - '.github/ci/publish-dhcp-interface-ha.py'
      - '.github/ci/dhcp_interface_ha_channel.py'
      - '.github/ci/verify-dhcp-interface-ha.sh'
      - '.github/ci/release_channel.py'
      - '.github/ci/target_pkg.py'
      - '.github/ci/package_checksums.py'
      - '.github/ci/setup-opnsense-repository.sh'
      - '.resolver-plugins/target-pkg.json'
      - '.github/ci/ci-tests/test_dhcp_interface_ha_release.py'
  pull_request:
    paths:
      - 'net/dhcp-interface-ha/**'
      - '.github/workflows/dhcp-interface-ha-tests.yml'
      - '.github/workflows/dhcp-interface-ha-release.yml'
      - '.github/ci/build-dhcp-interface-ha.sh'
      - '.github/ci/publish-dhcp-interface-ha.py'
      - '.github/ci/dhcp_interface_ha_channel.py'
      - '.github/ci/verify-dhcp-interface-ha.sh'
      - '.github/ci/release_channel.py'
      - '.github/ci/target_pkg.py'
      - '.github/ci/package_checksums.py'
      - '.github/ci/setup-opnsense-repository.sh'
      - '.resolver-plugins/target-pkg.json'
      - '.github/ci/ci-tests/test_dhcp_interface_ha_release.py'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install PHP test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y php-cli php-xml
          php --version
          php -r 'exit(extension_loaded("SimpleXML") ? 0 : 1);'
      - name: Python compile and unit tests
        run: |
          python -m compileall -q net/dhcp-interface-ha/src/opnsense/scripts/dhcp_interface_ha
          python -m unittest discover -s net/dhcp-interface-ha/tests -v
      - name: Plugin UI behavior
        run: |
          node net/dhcp-interface-ha/tests/ui/test_configure_lagg.js
          node net/dhcp-interface-ha/tests/ui/test_log.js
      - name: PHP syntax lint
        run: |
          find net/dhcp-interface-ha/src -type f \( -name '*.php' -o -name '*.inc' \) -print0 |
            xargs -0 -n1 php -l
      - name: Package and service shell lint
        run: |
          sh -n net/dhcp-interface-ha/+PRE_DEINSTALL.pre
          sh -n net/dhcp-interface-ha/+POST_DEINSTALL.post
          find net/dhcp-interface-ha/src/etc/rc.d net/dhcp-interface-ha/src/etc/rc.syshook.d net/dhcp-interface-ha/src/etc/rc.carp_service_status.d -type f -print0 | xargs -0 -n1 sh -n
          shellcheck -s sh -e SC1091 net/dhcp-interface-ha/+PRE_DEINSTALL.pre net/dhcp-interface-ha/+POST_DEINSTALL.post
          find net/dhcp-interface-ha/src/etc/rc.d net/dhcp-interface-ha/src/etc/rc.syshook.d net/dhcp-interface-ha/src/etc/rc.carp_service_status.d -type f -exec shellcheck -s sh -e SC1091 {} +
      - name: Release helper regression tests
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5'
          python -m pytest -q .github/ci/ci-tests/test_dhcp_interface_ha_release.py
          sh -n .github/ci/build-dhcp-interface-ha.sh .github/ci/verify-dhcp-interface-ha.sh
          shellcheck -s sh .github/ci/build-dhcp-interface-ha.sh .github/ci/verify-dhcp-interface-ha.sh
