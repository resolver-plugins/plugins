name: Publish BIND runtime release

on:
  push:
    branches: [master]
    paths:
      - 'dns/bind/Makefile'
  workflow_dispatch:
    inputs:
      mode:
        description: development builds an unsigned PR preview; production publishes the runtime channel
        required: true
        type: choice
        options: [development, production]
      series:
        description: OPNsense release series (<major>.<minor>)
        required: true
        type: string
      pull_number:
        description: Required for development; identifies a master or release-source PR
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: package-release
  cancel-in-progress: false
  queue: max

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      series: ${{ steps.select.outputs.series }}
      source_ref: ${{ steps.select.outputs.source_ref }}
      profile_ref: ${{ steps.select.outputs.profile_ref }}
      control_ref: ${{ steps.select.outputs.control_ref }}
      prerelease_tag: ${{ steps.select.outputs.prerelease_tag }}
      pull_number: ${{ steps.select.outputs.pull_number }}
      release: ${{ steps.select.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -eu
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/release/bind-rp/" --jq '[.[][] | .ref]' > "$RUNNER_TEMP/refs.json"
          python3 -I .github/ci/bind/shared/selection.py select-event \
            --component bind_runtime --event-file "$GITHUB_EVENT_PATH" \
            --refs-file "$RUNNER_TEMP/refs.json" \
            --output "$RUNNER_TEMP/event-selection.json" --github-output "$GITHUB_OUTPUT"

  profile:
    if: needs.select.outputs.release == 'true'
    needs: select
    runs-on: ubuntu-24.04
    outputs:
      control_commit: ${{ steps.profile.outputs.control_commit }}
      profile_commit: ${{ steps.profile.outputs.profile_commit }}
      freebsd_release: ${{ steps.profile.outputs.freebsd_release }}
      selection_sha256: ${{ steps.profile.outputs.selection_sha256 }}
      producer_action: ${{ steps.profile.outputs.producer_action }}
      expected_fingerprint: ${{ steps.profile.outputs.expected_fingerprint }}
      trusted_artifact_id: ${{ steps.trusted.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.select.outputs.control_ref }}
          persist-credentials: false
      - id: profile
        env:
          MODE: ${{ needs.select.outputs.mode }}
          SERIES: ${{ needs.select.outputs.series }}
          PROFILE_REF: ${{ needs.select.outputs.profile_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          control_commit=$(git rev-parse HEAD)
          git fetch --no-tags origin "$PROFILE_REF"
          profile_commit=$(git rev-parse FETCH_HEAD)
          git show "$profile_commit:.resolver-plugins/upstream.json" > "$RUNNER_TEMP/upstream.json"
          git show "$control_commit:dns/bind/Makefile" > "$RUNNER_TEMP/runtime-approval.mk"
          tools_tag=$(python3 .github/ci/shared/metadata_profile.py "$RUNNER_TEMP/upstream.json" "$SERIES" tools_tag)
          git init --bare "$RUNNER_TEMP/opnsense-tools"
          git -C "$RUNNER_TEMP/opnsense-tools" fetch --depth=1 https://github.com/opnsense/tools.git "refs/tags/$tools_tag:refs/tags/$tools_tag"
          python3 -I .github/ci/bind/shared/components.py inputs \
            --component bind_runtime --series "$SERIES" --mode "$MODE" \
            --upstream "$RUNNER_TEMP/upstream.json" --runtime-approval "$RUNNER_TEMP/runtime-approval.mk" \
            --tools-repository "$RUNNER_TEMP/opnsense-tools" --recipe .github/ci/bind/runtime/build-bind920.sh \
            --control-commit "$control_commit" --profile-commit "$profile_commit" \
            --trusted-directory artifacts/trusted --intake-directory "artifacts/$SERIES/intake" \
            --repository resolver-plugins/repository --output "$RUNNER_TEMP/controller.json"
          printf 'control_commit=%s\nprofile_commit=%s\n' "$control_commit" "$profile_commit" >> "$GITHUB_OUTPUT"
          python3 - "$RUNNER_TEMP/controller.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import sys

          result = json.loads(Path(sys.argv[1]).read_text())
          with Path(sys.argv[2]).open('a') as output:
              for key in ('selection_sha256', 'freebsd_release', 'producer_action', 'expected_fingerprint'):
                  output.write(f'{key}={result[key]}\n')
          PY
      - id: trusted
        uses: actions/upload-artifact@v4
        with:
          name: bind-runtime-trusted-${{ needs.select.outputs.series }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/trusted
          if-no-files-found: error
          retention-days: 30

  test:
    needs: [select, profile]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.profile.outputs.control_commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - run: python -m pytest -q .github/ci/ci-tests

  producer:
    needs: [select, profile, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      producer_artifact_id: ${{ steps.producer.outputs.artifact-id }}
    env:
      RP_TRUSTED_DIRECTORY: artifacts/trusted
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
      RP_UPSTREAM_METADATA: artifacts/trusted/upstream.json
      RP_TARGET_PKG_METADATA: artifacts/trusted/creator-target.json
      RP_READER_PKG_METADATA: artifacts/trusted/reader-target.json
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.profile.outputs.control_commit }}
          persist-credentials: false
      - name: Require the immutable controller artifact
        run: test -n '${{ needs.profile.outputs.trusted_artifact_id }}'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - name: Validate trusted runtime selection
        env:
          SERIES: ${{ needs.select.outputs.series }}
        run: |
          python3 -I .github/ci/bind/shared/components.py validate --component bind_runtime --series "$SERIES" \
            --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256"
      - name: Produce the selected BIND runtime pair
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: RP_TRUSTED_DIRECTORY RP_SELECTION_SHA256 RP_UPSTREAM_METADATA RP_TARGET_PKG_METADATA RP_READER_PKG_METADATA
          usesh: true
          disable-cache: true
          copyback: true
          prepare: |
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            git config --global --add safe.directory "$PWD"
            series='${{ needs.select.outputs.series }}'
            output="artifacts/$series/producer"
            python3 -I .github/ci/bind/shared/components.py validate --component bind_runtime --series "$series" \
              --trusted-directory "$RP_TRUSTED_DIRECTORY" --selection-sha256 "$RP_SELECTION_SHA256"
            test '${{ needs.profile.outputs.producer_action }}' = build
            .github/ci/bind/runtime/build-bind920.sh "$series" "$output"
      - id: producer
        uses: actions/upload-artifact@v4
        with:
          name: bind-runtime-producer-${{ needs.select.outputs.series }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ needs.select.outputs.series }}/producer
          if-no-files-found: error
          retention-days: 30

  sign:
    if: >-
      needs.select.outputs.mode == 'production' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.mode == 'production'))
    needs: [select, profile, producer]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      repository_artifact_id: ${{ steps.repository.outputs.artifact-id }}
      composition_sha256: ${{ steps.composition.outputs.composition_sha256 }}
    env:
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require immutable controller and producer artifacts
        run: |
          test -n '${{ needs.profile.outputs.trusted_artifact_id }}'
          test -n '${{ needs.producer.outputs.producer_artifact_id }}'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.producer.outputs.producer_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.select.outputs.series }}/producer
      - name: Check the trusted selection and fetch its exact profile object
        env:
          SERIES: ${{ needs.select.outputs.series }}
          PROFILE_COMMIT: ${{ needs.profile.outputs.profile_commit }}
          RP_EXPECTED_CONTROL_COMMIT: ${{ github.workflow_sha }}
          RP_PROFILE_CONTROL_COMMIT: ${{ needs.profile.outputs.control_commit }}
        run: |
          set -eu
          python3 -I .github/ci/bind/shared/components.py validate --component bind_runtime --series "$SERIES" \
            --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256" \
            --expected-control-commit "$RP_EXPECTED_CONTROL_COMMIT" --profile-control-commit "$RP_PROFILE_CONTROL_COMMIT"
      - name: Independently stage and sign the runtime repository
        uses: vmactions/freebsd-vm@v1
        env:
          RP_PKG_SIGNING_KEY: ${{ secrets.RP_PKG_SIGNING_KEY }}
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: RP_SELECTION_SHA256 RP_PKG_SIGNING_KEY GH_TOKEN
          usesh: true
          disable-cache: true
          copyback: true
          prepare: |
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git gh
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            git config --global --add safe.directory "$PWD"
            series='${{ needs.select.outputs.series }}'
            python3 -I .github/ci/bind/shared/components.py validate --component bind_runtime --series "$series" \
              --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256"
            python3 -I .github/ci/bind/shared/components.py authenticate --component bind_runtime --series "$series" \
              --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256" \
              --directory "artifacts/$series/producer" --pkg-command /usr/local/sbin/pkg-static
            umask 077
            key=.rp-pkg-signing-key.pem
            trap 'rm -f "$key"' EXIT HUP INT TERM
            printf '%s' "$RP_PKG_SIGNING_KEY" | base64 -d > "$key"
            python3 -I .github/ci/bind/shared/components.py stage --component bind_runtime --series "$series" \
              --directory "artifacts/$series/producer" --trusted-directory artifacts/trusted \
              --selection-sha256 "$RP_SELECTION_SHA256" --output "artifacts/$series/repository" \
              --pkg-command /usr/local/sbin/pkg-static --key "$key"
            rm -f "$key"
      - id: composition
        env:
          SERIES: ${{ needs.select.outputs.series }}
        run: |
          set -eu
          composition="artifacts/$SERIES/repository/composition-inputs.json"
          test -f "$composition"
          printf 'composition_sha256=%s\n' "$(sha256sum "$composition" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: repository
        uses: actions/upload-artifact@v4
        with:
          name: bind-runtime-repository-${{ needs.select.outputs.series }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ needs.select.outputs.series }}/repository
          if-no-files-found: error
          retention-days: 30

  verify:
    if: needs.select.outputs.mode == 'production'
    needs: [select, profile, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
      RP_VERIFY_EVIDENCE_DIRECTORY: artifacts/${{ needs.select.outputs.series }}/verification-bind_runtime-local
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.profile.outputs.control_commit }}
          persist-credentials: false
      - name: Require immutable controller and qualified repository artifacts
        run: |
          test -n '${{ needs.profile.outputs.trusted_artifact_id }}'
          test -n '${{ needs.sign.outputs.repository_artifact_id }}'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.select.outputs.series }}/repository
      - name: Qualify the signed pair and every composed repository
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: RP_SELECTION_SHA256 RP_COMPOSITION_SHA256 RP_VERIFY_EVIDENCE_DIRECTORY
          usesh: true
          disable-cache: true
          copyback: true
          prepare: |
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            git config --global --add safe.directory "$PWD"
            .github/ci/bind/shared/verify-bind-release.sh --component bind_runtime --mode local \
              --repository-root 'artifacts/${{ needs.select.outputs.series }}/repository' \
              --trusted-directory artifacts/trusted --series '${{ needs.select.outputs.series }}'
      - name: Save native qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bind-runtime-local-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RP_VERIFY_EVIDENCE_DIRECTORY }}
          if-no-files-found: ignore
          retention-days: 30

  publish:
    if: >-
      needs.select.outputs.mode == 'production' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.mode == 'production'))
    needs: [select, profile, sign, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require immutable controller and qualified repository artifacts
        run: |
          test -n '${{ needs.profile.outputs.trusted_artifact_id }}'
          test -n '${{ needs.sign.outputs.repository_artifact_id }}'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.select.outputs.series }}/repository
      - name: Check the external selection and composition seals
        env:
          SERIES: ${{ needs.select.outputs.series }}
          RP_EXPECTED_CONTROL_COMMIT: ${{ github.workflow_sha }}
          RP_PROFILE_CONTROL_COMMIT: ${{ needs.profile.outputs.control_commit }}
        run: |
          set -eu
          python3 -I .github/ci/bind/shared/components.py validate --component bind_runtime --series "$SERIES" \
            --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256" \
            --expected-control-commit "$RP_EXPECTED_CONTROL_COMMIT" --profile-control-commit "$RP_PROFILE_CONTROL_COMMIT" \
            --repository-root "artifacts/$SERIES/repository" --composition-sha256 "$RP_COMPOSITION_SHA256"
      - name: Require the distribution Pages health marker
        run: |
          set -eu
          attempt=1
          while [ "$(curl --fail --silent --show-error https://resolver-plugins.github.io/repository/pages-health || true)" != resolver-plugins-pages-ok ]; do
            [ "$attempt" -lt 10 ] || exit 1
            sleep 15
            attempt=$((attempt + 1))
          done
      - id: distribution-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RP_DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.RP_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: resolver-plugins
          repositories: repository
          permission-contents: write
      - name: Promote the qualified runtime and paired stack
        env:
          SERIES: ${{ needs.select.outputs.series }}
          GH_TOKEN: ${{ steps.distribution-token.outputs.token }}
        run: |
          python3 -I .github/ci/bind/shared/components.py publish --component bind_runtime --series "$SERIES" \
            --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256" \
            --composition-sha256 "$RP_COMPOSITION_SHA256" --repository-root "artifacts/$SERIES/repository" \
            --repository resolver-plugins/repository --recovery "$RUNNER_TEMP/recovery"
      - name: Save publication recovery evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bind-runtime-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery
          if-no-files-found: ignore
          retention-days: 30

  verify-published:
    if: needs.select.outputs.mode == 'production'
    needs: [select, profile, sign, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
      RP_VERIFY_EVIDENCE_DIRECTORY: artifacts/${{ needs.select.outputs.series }}/verification-bind_runtime-public
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.profile.outputs.control_commit }}
          persist-credentials: false
      - name: Require immutable controller and qualified repository artifacts
        run: |
          test -n '${{ needs.profile.outputs.trusted_artifact_id }}'
          test -n '${{ needs.sign.outputs.repository_artifact_id }}'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.select.outputs.series }}/repository
      - name: Compare public signed bytes and qualify the installer
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: RP_SELECTION_SHA256 RP_COMPOSITION_SHA256 RP_VERIFY_EVIDENCE_DIRECTORY
          usesh: true
          disable-cache: true
          copyback: true
          prepare: |
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            git config --global --add safe.directory "$PWD"
            .github/ci/bind/shared/verify-bind-release.sh --component bind_runtime --mode public \
              --repository-root 'artifacts/${{ needs.select.outputs.series }}/repository' \
              --trusted-directory artifacts/trusted --series '${{ needs.select.outputs.series }}'
      - name: Save public qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bind-runtime-public-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RP_VERIFY_EVIDENCE_DIRECTORY }}
          if-no-files-found: ignore
          retention-days: 30

  retention:
    if: >-
      needs.select.outputs.mode == 'production' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.mode == 'production'))
    needs: [select, profile, sign, verify-published]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require immutable controller and qualified repository artifacts
        run: |
          test -n '${{ needs.profile.outputs.trusted_artifact_id }}'
          test -n '${{ needs.sign.outputs.repository_artifact_id }}'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.select.outputs.series }}/repository
      - name: Check the external selection and composition seals
        env:
          SERIES: ${{ needs.select.outputs.series }}
          RP_EXPECTED_CONTROL_COMMIT: ${{ github.workflow_sha }}
          RP_PROFILE_CONTROL_COMMIT: ${{ needs.profile.outputs.control_commit }}
        run: |
          set -eu
          python3 -I .github/ci/bind/shared/components.py validate --component bind_runtime --series "$SERIES" \
            --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256" \
            --expected-control-commit "$RP_EXPECTED_CONTROL_COMMIT" --profile-control-commit "$RP_PROFILE_CONTROL_COMMIT" \
            --repository-root "artifacts/$SERIES/repository" --composition-sha256 "$RP_COMPOSITION_SHA256"
      - id: distribution-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RP_DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.RP_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: resolver-plugins
          repositories: repository
          permission-contents: write
      - name: Prune only unreferenced published snapshots
        env:
          SERIES: ${{ needs.select.outputs.series }}
          GH_TOKEN: ${{ steps.distribution-token.outputs.token }}
        run: |
          python3 -I .github/ci/bind/shared/components.py publish --retention-only \
            --component bind_runtime --series "$SERIES" --trusted-directory artifacts/trusted \
            --selection-sha256 "$RP_SELECTION_SHA256" --composition-sha256 "$RP_COMPOSITION_SHA256" \
            --repository-root "artifacts/$SERIES/repository" --repository resolver-plugins/repository \
            --recovery "$RUNNER_TEMP/retention-recovery"

  verify-development:
    if: needs.select.outputs.mode == 'development' && github.event_name == 'workflow_dispatch' && inputs.mode == 'development'
    needs: [select, profile, producer]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
      RP_VERIFY_EVIDENCE_DIRECTORY: artifacts/${{ needs.select.outputs.series }}/verification-bind_runtime-development
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.profile.outputs.control_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require immutable controller and preview producer artifacts
        run: |
          test -n '${{ needs.profile.outputs.trusted_artifact_id }}'
          test -n '${{ needs.producer.outputs.producer_artifact_id }}'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.producer.outputs.producer_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.select.outputs.series }}/producer
      - name: Check the trusted preview and fetch its exact profile object
        env:
          SERIES: ${{ needs.select.outputs.series }}
          PROFILE_COMMIT: ${{ needs.profile.outputs.profile_commit }}
        run: |
          set -eu
          python3 -I .github/ci/bind/shared/components.py validate --component bind_runtime --series "$SERIES" \
            --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256"
          git fetch --no-tags origin "$PROFILE_COMMIT"
      - name: Qualify an unsigned temporary runtime catalogue
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: RP_SELECTION_SHA256 RP_VERIFY_EVIDENCE_DIRECTORY
          usesh: true
          disable-cache: true
          copyback: true
          prepare: |
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            git config --global --add safe.directory "$PWD"
            series='${{ needs.select.outputs.series }}'
            python3 -I .github/ci/bind/shared/components.py stage --component bind_runtime --series "$series" \
              --directory "artifacts/$series/producer" --trusted-directory artifacts/trusted \
              --selection-sha256 "$RP_SELECTION_SHA256" --output "artifacts/$series/repository" \
              --pkg-command /usr/local/sbin/pkg-static
            .github/ci/bind/shared/verify-bind-release.sh --component bind_runtime --mode local \
              --repository-root "artifacts/$series/repository" --trusted-directory artifacts/trusted --series "$series"
      - name: Save preview qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bind-runtime-preview-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RP_VERIFY_EVIDENCE_DIRECTORY }}
          if-no-files-found: ignore
          retention-days: 30

  publish-development:
    if: needs.select.outputs.mode == 'development' && github.event_name == 'workflow_dispatch' && inputs.mode == 'development'
    needs: [select, profile, producer, verify-development]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    env:
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.profile.outputs.control_commit }}
          persist-credentials: false
      - name: Require immutable controller and preview producer artifacts
        run: |
          test -n '${{ needs.profile.outputs.trusted_artifact_id }}'
          test -n '${{ needs.producer.outputs.producer_artifact_id }}'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.producer.outputs.producer_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.select.outputs.series }}/producer
      - name: Publish the exact runtime PR preview
        env:
          TAG: ${{ needs.select.outputs.prerelease_tag }}
          SERIES: ${{ needs.select.outputs.series }}
          PULL_NUMBER: ${{ needs.select.outputs.pull_number }}
          INPUT_SERIES: ${{ inputs.series }}
          INPUT_PULL_NUMBER: ${{ inputs.pull_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          [ "$SERIES" = "$INPUT_SERIES" ] && [ "$PULL_NUMBER" = "$INPUT_PULL_NUMBER" ]
          [ "$TAG" = "pr-$PULL_NUMBER-$SERIES-bind-runtime" ]
          python3 -I .github/ci/bind/shared/components.py validate --component bind_runtime --series "$SERIES" \
            --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256"
          pr_state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_NUMBER" --jq .state)
          if [ "$pr_state" != open ]; then
            python3 -I .github/ci/shared/release_channel.py cleanup-tag --repository "$GITHUB_REPOSITORY" --tag "$TAG"
            exit 0
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "BIND runtime development $TAG" \
              --prerelease --notes 'Unsigned BIND runtime preview for pull request testing.'
          fi
          gh release upload "$TAG" "artifacts/$SERIES/producer"/* --clobber --repo "$GITHUB_REPOSITORY"
          pr_state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_NUMBER" --jq .state)
          if [ "$pr_state" != open ]; then
            python3 -I .github/ci/shared/release_channel.py cleanup-tag --repository "$GITHUB_REPOSITORY" --tag "$TAG"
          fi
