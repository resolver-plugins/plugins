name: Synchronize os-bind-rp upstream

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install CI test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - name: Run CI helper tests
        run: python -m pytest -q .github/ci/ci-tests

  reconcile:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch release and upstream inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/release/bind-rp/*:refs/heads/release/bind-rp/*' \
            '+refs/heads/sync/bind/*:refs/remotes/origin/sync/bind/*' \
            '+refs/heads/sync/bootstrap/*:refs/remotes/origin/sync/bootstrap/*'
          git remote add upstream https://github.com/opnsense/plugins.git
          git fetch --no-tags upstream \
            '+refs/heads/stable/*:refs/remotes/upstream/stable/*'
          git clone --no-checkout https://github.com/opnsense/tools.git \
            "$RUNNER_TEMP/opnsense-tools"
      - name: Recover an interrupted review publication
        id: recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RP_SYNC_REVIEWER: ${{ vars.RP_SYNC_REVIEWER }}
        run: |
          set -euo pipefail
          python3 .github/ci/publish_upstream.py recover \
            --repository . \
            --tools-repository "$RUNNER_TEMP/opnsense-tools" \
            --github-repository "$GITHUB_REPOSITORY" \
            --reviewer "$RP_SYNC_REVIEWER" \
            --output "$GITHUB_OUTPUT"
      - name: Discover reconciliation inputs
        if: steps.recovery.outputs.handled != 'true'
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/sync_upstream.py discover \
            --repository . \
            --upstream upstream \
            --release-prefix release/bind-rp/ \
            --metadata-path .resolver-plugins/upstream.json \
            --tools-repository "$RUNNER_TEMP/opnsense-tools" \
            --control-commit "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/discovery.json"
          python3 .github/ci/sync_upstream.py github-outputs \
            --discovery "$RUNNER_TEMP/discovery.json" --output "$GITHUB_OUTPUT"
      - name: Seal reviewed core and reconciliation inputs
        if: steps.recovery.outputs.handled != 'true' && steps.plan.outputs.action != 'noop'
        shell: bash
        run: |
          set -euo pipefail
          series='${{ steps.plan.outputs.series }}'
          core_line=$(git ls-remote https://github.com/opnsense/core.git \
            "refs/heads/stable/$series")
          read -r core_commit core_ref extra <<EOF
          $core_line
          EOF
          if [ -z "${core_commit:-}" ] || [ "$core_ref" != "refs/heads/stable/$series" ] || \
            [ -n "${extra:-}" ]
          then
            echo "cannot resolve the exact opnsense/core stable/$series commit" >&2
            exit 1
          fi
          core_archive_url="https://github.com/opnsense/core/archive/$core_commit.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/opnsense-core.tar.gz" "$core_archive_url"
          core_archive_sha256=$(sha256sum "$RUNNER_TEMP/opnsense-core.tar.gz" | awk '{print $1}')
          python3 .github/ci/sync_upstream.py seal-plan \
            --discovery "$RUNNER_TEMP/discovery.json" \
            --core-commit "$core_commit" \
            --core-archive-url "$core_archive_url" \
            --core-archive-sha256 "$core_archive_sha256" \
            --output "$RUNNER_TEMP/plan.json"
      - name: Apply sealed plan locally
        if: steps.recovery.outputs.handled != 'true' && steps.plan.outputs.action != 'noop'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          python3 .github/ci/sync_upstream.py apply \
            --repository . \
            --plan "$RUNNER_TEMP/plan.json" \
            --tools-repository "$RUNNER_TEMP/opnsense-tools"
      - name: Publish validated plan state
        if: steps.recovery.outputs.handled != 'true' && steps.plan.outputs.action != 'noop'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RP_SYNC_REVIEWER: ${{ vars.RP_SYNC_REVIEWER }}
        run: |
          set -euo pipefail
          python3 .github/ci/publish_upstream.py publish \
            --repository . \
            --plan "$RUNNER_TEMP/plan.json" \
            --tools-repository "$RUNNER_TEMP/opnsense-tools" \
            --github-repository "$GITHUB_REPOSITORY" \
            --reviewer "$RP_SYNC_REVIEWER"
      - name: Check out bootstrap release
        if: steps.recovery.outputs.handled != 'true' && steps.plan.outputs.action == 'bootstrap-build'
        shell: bash
        run: git checkout '${{ steps.plan.outputs.target_release }}'
      - name: Seal runtime bootstrap inputs from the trusted control plane
        if: steps.recovery.outputs.handled != 'true' && steps.plan.outputs.action == 'bootstrap-build'
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          control_commit=$(python3 -I .github/ci/shared/workflow_data.py field "$RUNNER_TEMP/plan.json" control_commit)
          profile_commit=$(git rev-parse HEAD)
          git show "$control_commit:dns/bind/Makefile" > "$RUNNER_TEMP/runtime-approval.mk"
          git archive "$control_commit" .github/ci \
            docs/package-repository/resolver-plugins.pub | tar -x
          series='${{ steps.plan.outputs.series }}'
          python3 -I .github/ci/bind/shared/components.py inputs \
            --component bind_runtime --series "$series" --mode development \
            --upstream .resolver-plugins/upstream.json \
            --runtime-approval "$RUNNER_TEMP/runtime-approval.mk" \
            --tools-repository "$RUNNER_TEMP/opnsense-tools" \
            --recipe .github/ci/bind/runtime/build-bind920.sh \
            --control-commit "$control_commit" --profile-commit "$profile_commit" \
            --trusted-directory artifacts/trusted --intake-directory "artifacts/$series/intake" \
            --output "$RUNNER_TEMP/bootstrap-controller.json"
          python3 -I .github/ci/shared/workflow_data.py outputs "$RUNNER_TEMP/bootstrap-controller.json" \
            selection_sha256 >> "$GITHUB_OUTPUT"
      - name: Build bootstrap in planner-selected FreeBSD release
        if: steps.recovery.outputs.handled != 'true' && steps.plan.outputs.action == 'bootstrap-build'
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ steps.plan.outputs.freebsd_release }}
          arch: x86_64
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3
            series='${{ steps.plan.outputs.series }}'
            output="artifacts/$series/producer"
            export RP_TRUSTED_DIRECTORY=artifacts/trusted
            export RP_SELECTION_SHA256='${{ steps.bootstrap.outputs.selection_sha256 }}'
            RP_UPSTREAM_METADATA=artifacts/trusted/upstream.json \
              RP_TARGET_PKG_METADATA=artifacts/trusted/creator-target.json \
              .github/ci/bind/runtime/build-bind920.sh "$series" "$output"
      - name: Upload bootstrap artifact
        if: steps.recovery.outputs.handled != 'true' && steps.plan.outputs.action == 'bootstrap-build'
        uses: actions/upload-artifact@v4
        with:
          name: bind-runtime-bootstrap-${{ steps.plan.outputs.series }}
          path: artifacts/${{ steps.plan.outputs.series }}/producer
          retention-days: 7
