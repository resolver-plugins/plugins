name: Publish BIND plugin release

on:
  push:
    branches: [master]
    paths:
      - '.github/ci/bind/plugin/**'
      - '.github/ci/bind/shared/**'
      - '.github/ci/shared/**'
      - '.github/workflows/bind-plugin-release.yml'
      - 'docs/package-repository/resolver-plugins.pub'
      - 'dns/bind/**'
      - '!dns/bind/tests/**'
      - 'Mk/**'
      - 'Scripts/**'
      - 'Templates/**'
      - 'scripts/install-os-bind-rp*'
  pull_request_target:
    types: [closed]
    branches: ['release/bind-rp/**']
    paths:
      - '.resolver-plugins/upstream.json'
      - 'dns/bind/**'
      - '!dns/bind/tests/**'
      - 'Mk/**'
      - 'Scripts/**'
      - 'Templates/**'
  workflow_dispatch:
    inputs:
      mode:
        description: development publishes an unsigned PR preview; production publishes the plugin channel
        required: true
        type: choice
        options: [development, production]
      series:
        description: OPNsense release series
        required: true
        type: string
      pull_number:
        description: Required for development; master or release-source PR number
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: package-release
  cancel-in-progress: false
  queue: max

jobs:
  select:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.select.outputs.release }}
      mode: ${{ steps.select.outputs.mode }}
      series: ${{ steps.select.outputs.series }}
      source_ref: ${{ steps.select.outputs.source_ref }}
      profile_ref: ${{ steps.select.outputs.profile_ref }}
      control_ref: ${{ steps.select.outputs.control_ref }}
      prerelease_tag: ${{ steps.select.outputs.prerelease_tag }}
      pull_number: ${{ steps.select.outputs.pull_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/release/bind-rp/" > "$RUNNER_TEMP/refs-pages.json"
          jq '[.[][] | .ref]' "$RUNNER_TEMP/refs-pages.json" > "$RUNNER_TEMP/refs.json"
          python3 -I .github/ci/bind/shared/selection.py select-event \
            --component bind_plugin --event-file "$GITHUB_EVENT_PATH" --refs-file "$RUNNER_TEMP/refs.json" \
            --output "$RUNNER_TEMP/event-selection.json" \
            --github-output "$GITHUB_OUTPUT"

  profile:
    if: needs.select.outputs.release == 'true'
    needs: select
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.profile.outputs.source_commit }}
      control_commit: ${{ steps.profile.outputs.control_commit }}
      freebsd_release: ${{ steps.profile.outputs.freebsd_release }}
      producer_action: ${{ steps.profile.outputs.producer_action }}
      selection_sha256: ${{ steps.profile.outputs.selection_sha256 }}
      trusted_artifact_id: ${{ steps.trusted.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.select.outputs.control_ref }}
          persist-credentials: false
      - id: profile
        env:
          GH_TOKEN: ${{ github.token }}
          SERIES: ${{ needs.select.outputs.series }}
          MODE: ${{ needs.select.outputs.mode }}
          SOURCE_REF: ${{ needs.select.outputs.source_ref }}
        run: |
          set -euo pipefail
          control_commit=$(git rev-parse HEAD)
          git fetch --no-tags origin "$SOURCE_REF"
          source_commit=$(git rev-parse 'FETCH_HEAD^{commit}')
          git show "$source_commit:.resolver-plugins/upstream.json" > "$RUNNER_TEMP/upstream.json"
          git show "$control_commit:dns/bind/Makefile" > "$RUNNER_TEMP/runtime-approval.mk"
          tools_tag=$(python3 .github/ci/shared/metadata_profile.py "$RUNNER_TEMP/upstream.json" "$SERIES" tools_tag)
          git init --bare "$RUNNER_TEMP/opnsense-tools"
          git -C "$RUNNER_TEMP/opnsense-tools" fetch --depth=1 https://github.com/opnsense/tools.git "refs/tags/$tools_tag:refs/tags/$tools_tag"
          git show "$source_commit:dns/bind/Makefile" > "$RUNNER_TEMP/plugin-package.mk"
          python3 -I .github/ci/bind/shared/components.py inputs \
            --component bind_plugin --series "$SERIES" --mode "$MODE" \
            --upstream "$RUNNER_TEMP/upstream.json" --runtime-approval "$RUNNER_TEMP/runtime-approval.mk" \
            --tools-repository "$RUNNER_TEMP/opnsense-tools" --package-definition "$RUNNER_TEMP/plugin-package.mk" --recipe .github/ci/bind/plugin/build-os-bind-rp.sh \
            --control-commit "$control_commit" --profile-commit "$source_commit" --source-commit "$source_commit" \
            --trusted-directory artifacts/trusted --intake-directory "artifacts/$SERIES/intake" \
            --repository resolver-plugins/repository --output "$RUNNER_TEMP/controller.json"
          printf 'control_commit=%s\nsource_commit=%s\n' "$control_commit" "$source_commit" >> "$GITHUB_OUTPUT"
          python3 -I .github/ci/shared/workflow_data.py outputs "$RUNNER_TEMP/controller.json" \
            freebsd_release producer_action selection_sha256 >> "$GITHUB_OUTPUT"
      - id: trusted
        uses: actions/upload-artifact@v4
        with:
          name: bind-plugin-trusted-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/trusted
          if-no-files-found: error
          retention-days: 7

  test:
    needs: profile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.profile.outputs.control_commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - run: python -m pytest -q .github/ci/ci-tests

  producer:
    needs: [select, profile, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      producer_artifact_id: ${{ steps.producer.outputs.artifact-id }}
    env:
      RP_TRUSTED_DIRECTORY: artifacts/trusted
      RP_RUNTIME_DIRECTORY: artifacts/${{ needs.select.outputs.series }}/intake/bind_runtime
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
      SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.profile.outputs.control_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - name: Materialize exact source and frozen intake
        env:
          GH_TOKEN: ${{ github.token }}
          SERIES: ${{ needs.select.outputs.series }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_COMMIT"
          python3 -I .github/ci/bind/plugin/plugin_release.py materialize \
            --series "$SERIES" --trusted-directory "$RP_TRUSTED_DIRECTORY" --selection-sha256 "$RP_SELECTION_SHA256" \
            --repository-root "$PWD" --source-commit "$SOURCE_COMMIT"
          python3 -I .github/ci/bind/plugin/plugin_release.py intake \
            --series "$SERIES" --trusted-directory "$RP_TRUSTED_DIRECTORY" --selection-sha256 "$RP_SELECTION_SHA256" \
            --repository resolver-plugins/repository --output-directory "artifacts/$SERIES/intake"
      - name: Build or reuse only the plugin
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: RP_TRUSTED_DIRECTORY RP_RUNTIME_DIRECTORY RP_SELECTION_SHA256 SOURCE_COMMIT
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git
            git config --global --add safe.directory "$PWD"
            series='${{ needs.select.outputs.series }}'
            output="artifacts/$series/producer"
            python3 -I .github/ci/bind/shared/components.py validate \
              --component bind_plugin --series "$series" --trusted-directory "$RP_TRUSTED_DIRECTORY" \
              --selection-sha256 "$RP_SELECTION_SHA256" >/dev/null
            action=$(python3 -I .github/ci/shared/workflow_data.py field "$RP_TRUSTED_DIRECTORY/selection.json" producer_action)
            if [ "$action" = build ]; then
              if [ '${{ needs.select.outputs.mode }}' = development ]; then
                export RP_PLUGIN_DEVEL=yes
              fi
              .github/ci/bind/plugin/build-os-bind-rp.sh "$series" "$output"
            elif [ "$action" = reuse ]; then
              export RP_UPSTREAM_METADATA="$RP_TRUSTED_DIRECTORY/upstream.json"
              export RP_TARGET_PKG_METADATA="$RP_TRUSTED_DIRECTORY/reader-target.json"
              .github/ci/shared/setup-opnsense-repository.sh "$series" >/dev/null
              python3 -I .github/ci/shared/target_pkg.py install "$RP_TARGET_PKG_METADATA" "$series" \
                --upstream "$RP_UPSTREAM_METADATA" --role reader --pkg-command /usr/local/sbin/pkg-static >/dev/null
              python3 -I .github/ci/bind/shared/components.py freeze-runtime \
                --component bind_plugin --series "$series" --trusted-directory "$RP_TRUSTED_DIRECTORY" \
                --selection-sha256 "$RP_SELECTION_SHA256" --directory "$RP_RUNTIME_DIRECTORY" \
                --pkg-command /usr/local/sbin/pkg-static >/dev/null
              python3 -I .github/ci/bind/plugin/plugin_release.py reuse \
                --series "$series" --trusted-directory "$RP_TRUSTED_DIRECTORY" --selection-sha256 "$RP_SELECTION_SHA256" \
                --directory "artifacts/$series/intake/cached_component" --output-directory "$output" \
                --pkg-command /usr/local/sbin/pkg-static
            else
              echo 'invalid sealed plugin action' >&2
              exit 1
            fi
      - id: producer
        uses: actions/upload-artifact@v4
        with:
          name: bind-plugin-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ needs.select.outputs.series }}/producer
          if-no-files-found: error
          retention-days: 7

  verify-development:
    if: needs.select.outputs.mode == 'development'
    needs: [select, profile, producer]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
      RP_VERIFY_EVIDENCE_DIRECTORY: artifacts/${{ needs.select.outputs.series }}/verification-development
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.profile.outputs.control_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.producer.outputs.producer_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.select.outputs.series }}/producer
      - uses: vmactions/freebsd-vm@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: GH_TOKEN RP_SELECTION_SHA256 RP_VERIFY_EVIDENCE_DIRECTORY
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git gh
            git config --global --add safe.directory "$PWD"
            series='${{ needs.select.outputs.series }}'
            python3 -I .github/ci/bind/shared/components.py stage --component bind_plugin --series "$series" \
              --directory "artifacts/$series/producer" --trusted-directory artifacts/trusted \
              --selection-sha256 "$RP_SELECTION_SHA256" --output "artifacts/$series/repository" \
              --pkg-command /usr/local/sbin/pkg-static
            .github/ci/bind/shared/verify-bind-release.sh --component bind_plugin --mode local \
              --repository-root "artifacts/$series/repository" --trusted-directory artifacts/trusted --series "$series"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bind-plugin-verification-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ needs.select.outputs.series }}/verification-development
          if-no-files-found: error
          retention-days: 7

  publish-development:
    if: needs.select.outputs.mode == 'development' && github.event_name == 'workflow_dispatch' && inputs.mode == 'development'
    needs: [select, profile, producer, verify-development]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.profile.outputs.control_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.producer.outputs.producer_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.select.outputs.series }}/producer
      - name: Publish unsigned plugin preview
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select.outputs.prerelease_tag }}
          SERIES: ${{ needs.select.outputs.series }}
          PULL_NUMBER: ${{ needs.select.outputs.pull_number }}
        run: |
          set -euo pipefail
          [ "$TAG" = "pr-$PULL_NUMBER-$SERIES-bind-plugin" ]
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_NUMBER" --jq .state)" != open ]; then
            python3 -I .github/ci/shared/release_channel.py cleanup-tag --repository "$GITHUB_REPOSITORY" --tag "$TAG"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "os-bind-rp development $TAG" --prerelease --notes "Unsigned plugin preview for pull request testing." || gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" "artifacts/$SERIES/producer"/* --clobber --repo "$GITHUB_REPOSITORY"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_NUMBER" --jq .state)" != open ]; then
            python3 -I .github/ci/shared/release_channel.py cleanup-tag --repository "$GITHUB_REPOSITORY" --tag "$TAG"
          fi

  sign:
    if: >-
      needs.select.outputs.mode == 'production' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.mode == 'production') ||
       (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.base.ref, 'release/bind-rp/') &&
        github.workflow_ref == format('{0}/.github/workflows/bind-plugin-release.yml@refs/heads/master', github.repository)))
    needs: [select, profile, producer]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      repository_artifact_id: ${{ steps.repository.outputs.artifact-id }}
      composition_sha256: ${{ steps.composition.outputs.composition_sha256 }}
    env:
      RP_EXPECTED_CONTROL_COMMIT: ${{ github.workflow_sha }}
      RP_PROFILE_CONTROL_COMMIT: ${{ needs.profile.outputs.control_commit }}
      RP_SERIES: ${{ needs.select.outputs.series }}
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.producer.outputs.producer_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.select.outputs.series }}/producer
      - name: Bind privileged code to the executing control
        run: |
          set -eu
          python3 -I .github/ci/bind/shared/components.py validate --component bind_plugin --series "$RP_SERIES" \
            --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256" \
            --expected-control-commit "$RP_EXPECTED_CONTROL_COMMIT" --profile-control-commit "$RP_PROFILE_CONTROL_COMMIT"
      - name: Independently stage plugin and qualified peers
        uses: vmactions/freebsd-vm@v1
        env:
          RP_PKG_SIGNING_KEY: ${{ secrets.RP_PKG_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: RP_PKG_SIGNING_KEY GH_TOKEN RP_SELECTION_SHA256
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git gh
            git config --global --add safe.directory "$PWD"
            series='${{ needs.select.outputs.series }}'
            python3 -I .github/ci/bind/shared/components.py validate --component bind_plugin --series "$series" \
              --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256" >/dev/null
            python3 -I .github/ci/bind/shared/components.py authenticate --component bind_plugin --series "$series" \
              --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256" \
              --directory "artifacts/$series/producer" --pkg-command /usr/local/sbin/pkg-static
            umask 077
            key="$PWD/.rp-plugin-signing-key.pem"
            trap 'rm -f "$key"' EXIT HUP INT TERM
            printf '%s' "$RP_PKG_SIGNING_KEY" | base64 -d > "$key"
            python3 -I .github/ci/bind/shared/components.py stage --component bind_plugin --series "$series" \
              --directory "artifacts/$series/producer" --trusted-directory artifacts/trusted \
              --selection-sha256 "$RP_SELECTION_SHA256" --output "artifacts/$series/repository" \
              --key "$key" --pkg-command /usr/local/sbin/pkg-static
      - id: composition
        env:
          SERIES: ${{ needs.select.outputs.series }}
        run: |
          composition_sha256=$(sha256sum "artifacts/$SERIES/repository/composition-inputs.json" | cut -d ' ' -f 1)
          printf 'composition_sha256=%s\n' "$composition_sha256" >> "$GITHUB_OUTPUT"
      - id: repository
        uses: actions/upload-artifact@v4
        with:
          name: bind-plugin-repository-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ needs.select.outputs.series }}/repository
          if-no-files-found: error
          retention-days: 7

  verify:
    if: needs.select.outputs.mode == 'production'
    needs: [select, profile, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
      RP_VERIFY_EVIDENCE_DIRECTORY: artifacts/${{ needs.select.outputs.series }}/verification-local
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.profile.outputs.control_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.select.outputs.series }}/repository
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: RP_SELECTION_SHA256 RP_COMPOSITION_SHA256 RP_VERIFY_EVIDENCE_DIRECTORY
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git
            git config --global --add safe.directory "$PWD"
            .github/ci/bind/shared/verify-bind-release.sh --component bind_plugin --mode local \
              --repository-root 'artifacts/${{ needs.select.outputs.series }}/repository' \
              --trusted-directory artifacts/trusted --series '${{ needs.select.outputs.series }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bind-plugin-verification-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ needs.select.outputs.series }}/verification-local
          if-no-files-found: error
          retention-days: 7

  publish:
    if: >-
      needs.select.outputs.mode == 'production' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.mode == 'production') ||
       (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.base.ref, 'release/bind-rp/') &&
        github.workflow_ref == format('{0}/.github/workflows/bind-plugin-release.yml@refs/heads/master', github.repository)))
    needs: [select, profile, sign, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RP_EXPECTED_CONTROL_COMMIT: ${{ github.workflow_sha }}
      RP_PROFILE_CONTROL_COMMIT: ${{ needs.profile.outputs.control_commit }}
      RP_SERIES: ${{ needs.select.outputs.series }}
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.select.outputs.series }}/repository
      - name: Bind privileged code to the executing control
        run: |
          set -eu
          python3 -I .github/ci/bind/shared/components.py validate --component bind_plugin --series "$RP_SERIES" \
            --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256" \
            --expected-control-commit "$RP_EXPECTED_CONTROL_COMMIT" --profile-control-commit "$RP_PROFILE_CONTROL_COMMIT" \
            --repository-root "artifacts/$RP_SERIES/repository" --composition-sha256 "$RP_COMPOSITION_SHA256"
      - name: Require the distribution Pages health marker
        run: |
          set -eu
          attempt=1
          while [ "$(curl --fail --silent --show-error https://resolver-plugins.github.io/repository/pages-health || true)" != resolver-plugins-pages-ok ]; do
            [ "$attempt" -lt 10 ] || exit 1
            sleep 15
            attempt=$((attempt + 1))
          done
      - id: distribution-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RP_DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.RP_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: resolver-plugins
          repositories: repository
          permission-contents: write
      - name: Publish qualified component, stack and feed
        env:
          GH_TOKEN: ${{ steps.distribution-token.outputs.token }}
        run: |
          python3 -I .github/ci/bind/shared/components.py publish --component bind_plugin \
            --series '${{ needs.select.outputs.series }}' --trusted-directory artifacts/trusted \
            --selection-sha256 "$RP_SELECTION_SHA256" --composition-sha256 "$RP_COMPOSITION_SHA256" \
            --repository-root 'artifacts/${{ needs.select.outputs.series }}/repository' \
            --repository resolver-plugins/repository --recovery "$RUNNER_TEMP/recovery"
      - name: Save publication recovery evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bind-plugin-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery
          if-no-files-found: ignore
          retention-days: 7

  verify-published:
    if: needs.select.outputs.mode == 'production'
    needs: [select, profile, sign, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
      RP_VERIFY_EVIDENCE_DIRECTORY: artifacts/${{ needs.select.outputs.series }}/verification-public
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.profile.outputs.control_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.select.outputs.series }}/repository
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: RP_SELECTION_SHA256 RP_COMPOSITION_SHA256 RP_VERIFY_EVIDENCE_DIRECTORY
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git
            git config --global --add safe.directory "$PWD"
            .github/ci/bind/shared/verify-bind-release.sh --component bind_plugin --mode public \
              --repository-root 'artifacts/${{ needs.select.outputs.series }}/repository' \
              --trusted-directory artifacts/trusted --series '${{ needs.select.outputs.series }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bind-plugin-verification-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ needs.select.outputs.series }}/verification-public
          if-no-files-found: error
          retention-days: 7

  source-release:
    if: >-
      needs.select.outputs.mode == 'production' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.mode == 'production') ||
       (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.base.ref, 'release/bind-rp/') &&
        github.workflow_ref == format('{0}/.github/workflows/bind-plugin-release.yml@refs/heads/master', github.repository)))
    needs: [select, profile, sign, verify-published]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RP_EXPECTED_CONTROL_COMMIT: ${{ github.workflow_sha }}
      RP_PROFILE_CONTROL_COMMIT: ${{ needs.profile.outputs.control_commit }}
      RP_SERIES: ${{ needs.select.outputs.series }}
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.select.outputs.series }}/repository
      - name: Bind privileged code to the executing control
        run: |
          set -eu
          python3 -I .github/ci/bind/shared/components.py validate --component bind_plugin --series "$RP_SERIES" \
            --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256" \
            --expected-control-commit "$RP_EXPECTED_CONTROL_COMMIT" --profile-control-commit "$RP_PROFILE_CONTROL_COMMIT" \
            --repository-root "artifacts/$RP_SERIES/repository" --composition-sha256 "$RP_COMPOSITION_SHA256"
      - name: Publish original plugin source assets
        env:
          GH_TOKEN: ${{ github.token }}
          SERIES: ${{ needs.select.outputs.series }}
        run: |
          set -euo pipefail
          tag=$(python3 -I .github/ci/bind/plugin/plugin_release.py source-assets \
            --series "$SERIES" --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256" \
            --repository-root "artifacts/$SERIES/repository" --composition-sha256 "$RP_COMPOSITION_SHA256" \
            --output-directory "$RUNNER_TEMP/source-release")
          version=$(python3 -I .github/ci/shared/workflow_data.py field \
            "artifacts/$SERIES/repository/component/current/channel.json" plugin_version)
          python3 -I .github/ci/shared/release_channel.py publish-immutable --repository "$GITHUB_REPOSITORY" \
            --tag "$tag" --directory "$RUNNER_TEMP/source-release" --title "os-bind-rp $SERIES $version"

  retention:
    if: >-
      needs.select.outputs.mode == 'production' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.mode == 'production') ||
       (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.base.ref, 'release/bind-rp/') &&
        github.workflow_ref == format('{0}/.github/workflows/bind-plugin-release.yml@refs/heads/master', github.repository)))
    needs: [select, profile, sign, verify-published, source-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RP_EXPECTED_CONTROL_COMMIT: ${{ github.workflow_sha }}
      RP_PROFILE_CONTROL_COMMIT: ${{ needs.profile.outputs.control_commit }}
      RP_SERIES: ${{ needs.select.outputs.series }}
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.trusted_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.select.outputs.series }}/repository
      - name: Bind privileged code to the executing control
        run: |
          set -eu
          python3 -I .github/ci/bind/shared/components.py validate --component bind_plugin --series "$RP_SERIES" \
            --trusted-directory artifacts/trusted --selection-sha256 "$RP_SELECTION_SHA256" \
            --expected-control-commit "$RP_EXPECTED_CONTROL_COMMIT" --profile-control-commit "$RP_PROFILE_CONTROL_COMMIT" \
            --repository-root "artifacts/$RP_SERIES/repository" --composition-sha256 "$RP_COMPOSITION_SHA256"
      - id: distribution-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RP_DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.RP_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: resolver-plugins
          repositories: repository
          permission-contents: write
      - name: Retain referenced component and stack history
        env:
          GH_TOKEN: ${{ steps.distribution-token.outputs.token }}
        run: |
          python3 -I .github/ci/bind/shared/components.py publish --component bind_plugin \
            --series '${{ needs.select.outputs.series }}' --trusted-directory artifacts/trusted \
            --selection-sha256 "$RP_SELECTION_SHA256" --composition-sha256 "$RP_COMPOSITION_SHA256" \
            --repository-root 'artifacts/${{ needs.select.outputs.series }}/repository' \
            --repository resolver-plugins/repository --recovery "$RUNNER_TEMP/recovery" --retention-only
