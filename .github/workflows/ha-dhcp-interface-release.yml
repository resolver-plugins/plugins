name: Publish HA DHCP Interface package release

on:
  push:
    branches: [master]
    paths:
      - 'net/dhcp-interface-ha/**'
      - '!net/dhcp-interface-ha/tests/**'
      - '!net/dhcp-interface-ha/README.md'
  pull_request_target:
    types: [closed]
    branches: ['release/dhcp-interface-ha/**']
    paths:
      - 'net/dhcp-interface-ha/**'
      - '!net/dhcp-interface-ha/tests/**'
      - '!net/dhcp-interface-ha/README.md'
  workflow_dispatch:
    inputs:
      series:
        description: OPNsense series with an existing reviewed release source
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dhcp-interface-ha-${{ inputs.series || github.event.pull_request.base.ref || 'discovery' }}
  cancel-in-progress: false
  queue: max

jobs:
  select:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: write
    outputs:
      release: ${{ steps.select.outputs.release }}
      series: ${{ steps.select.outputs.series }}
      source_ref: ${{ steps.select.outputs.source_ref }}
      control_ref: ${{ steps.select.outputs.control_ref }}
      discovery_sha256: ${{ steps.select.outputs.discovery_sha256 }}
      discovery_artifact_id: ${{ steps.discovered.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/release/dhcp-interface-ha/" > "$RUNNER_TEMP/refs-pages.json"
          jq '[.[][] | .ref]' "$RUNNER_TEMP/refs-pages.json" > "$RUNNER_TEMP/refs.json"
          python3 -I .github/ci/shared/series_builds.py select-event \
            --component dhcp_interface_ha --event-file "$GITHUB_EVENT_PATH" --refs-file "$RUNNER_TEMP/refs.json" \
            --directory artifacts/discovered --dispatch \
            --output "$RUNNER_TEMP/event-selection.json" --github-output "$GITHUB_OUTPUT"
      - id: discovered
        if: steps.select.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ha-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/discovered
          if-no-files-found: error
          retention-days: 7

  profile:
    needs: select
    if: needs.select.outputs.release == 'true'
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ needs.select.outputs.release }}
      series: ${{ needs.select.outputs.series }}
      source_commit: ${{ steps.profile.outputs.source_commit }}
      control_commit: ${{ steps.profile.outputs.control_commit }}
      selection_sha256: ${{ steps.profile.outputs.selection_sha256 }}
      package_abi: ${{ steps.profile.outputs.package_abi }}
      profile_commit: ${{ steps.profile.outputs.profile_commit }}
      freebsd_release: ${{ steps.profile.outputs.freebsd_release }}
      target_artifact_id: ${{ steps.pkg-targets.outputs.artifact-id }}
      creator_target_sha256: ${{ steps.profile.outputs.creator_target_sha256 }}
      reader_target_sha256: ${{ steps.profile.outputs.reader_target_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.select.outputs.control_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.select.outputs.discovery_artifact_id }}
          path: ${{ runner.temp }}/discovered
          merge-multiple: true
      - id: profile
        env:
          SERIES: ${{ needs.select.outputs.series }}
          SOURCE_REF: ${{ needs.select.outputs.source_ref }}
        run: |
          set -eu
          control_commit=$(git rev-parse HEAD)
          test "$control_commit" = '${{ github.workflow_sha }}'
          git fetch --no-tags origin "$SOURCE_REF"
          source_commit=$(git rev-parse 'FETCH_HEAD^{commit}')
          python3 -I .github/ci/shared/series_builds.py materialize-discovery \
            --component dhcp_interface_ha --directory "$RUNNER_TEMP/discovered" \
            --sha256 '${{ needs.select.outputs.discovery_sha256 }}' \
            --source-commit "$source_commit" --control-commit "$control_commit" --series "$SERIES" \
            --tools-repository "$RUNNER_TEMP/opnsense-tools" --output "$RUNNER_TEMP/upstream.json"
          selection_sha256=$(python3 -I .github/ci/ha_dhcp/dhcp_interface_ha_release.py source-inputs \
            --series "$SERIES" --directory artifacts/trusted --source-commit "$source_commit" --control-commit "$control_commit" \
            --upstream "$RUNNER_TEMP/upstream.json" \
            --series-build-inputs "$RUNNER_TEMP/discovered/series-build-inputs.json" \
            --tools-profile "$RUNNER_TEMP/discovered/tools-profile.json")
          freebsd_release=$(python3 .github/ci/shared/metadata_profile.py artifacts/trusted/upstream.json "$SERIES" freebsd_release)
          printf 'source_commit=%s\nprofile_commit=%s\ncontrol_commit=%s\nselection_sha256=%s\nfreebsd_release=%s\n' \
            "$source_commit" "$source_commit" "$control_commit" "$selection_sha256" "$freebsd_release" >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/discovered/creator-target.json" "$RUNNER_TEMP/discovered/reader-target.json" artifacts/trusted/
          printf 'package_abi=%s\n' "$(python3 .github/ci/shared/target_pkg.py field artifacts/trusted/creator-target.json "$SERIES" abi)" >> "$GITHUB_OUTPUT"
          printf 'creator_target_sha256=%s\nreader_target_sha256=%s\n' "$(sha256sum artifacts/trusted/creator-target.json | cut -d ' ' -f1)" "$(sha256sum artifacts/trusted/reader-target.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: pkg-targets
        uses: actions/upload-artifact@v4
        with:
          name: pkg-targets-dhcp-${{ needs.select.outputs.series }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/trusted
          if-no-files-found: error
          retention-days: 7

  build:
    needs: profile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      producer_artifact_id: ${{ steps.producer.outputs.artifact-id }}
    env:
      RP_TRUSTED_DIRECTORY: artifacts/trusted
      RP_SELECTION_SHA256: ${{ needs.profile.outputs.selection_sha256 }}
      CONTROL_COMMIT: ${{ needs.profile.outputs.control_commit }}
      RP_TARGET_PKG_METADATA: artifacts/trusted/creator-target.json
      RP_READER_PKG_METADATA: artifacts/trusted/reader-target.json
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.profile.outputs.control_commit }}
          persist-credentials: false
      - name: Require resolved pkg target artifact
        run: test -n '${{ needs.profile.outputs.target_artifact_id }}'
      - name: Download resolved pkg targets
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.target_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - name: Validate resolved pkg targets
        shell: bash
        env:
          SERIES: ${{ needs.profile.outputs.series }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '${{ needs.profile.outputs.source_commit }}'
          python3 -I .github/ci/ha_dhcp/dhcp_interface_ha_release.py validate-source \
            --series "$SERIES" --directory artifacts/trusted --repository-root "$PWD" \
            --source-commit '${{ needs.profile.outputs.source_commit }}' --control-commit '${{ github.workflow_sha }}' \
            --sha256 '${{ needs.profile.outputs.selection_sha256 }}'
          printf '%s  %s\n' '${{ needs.profile.outputs.creator_target_sha256 }}' artifacts/trusted/creator-target.json '${{ needs.profile.outputs.reader_target_sha256 }}' artifacts/trusted/reader-target.json | sha256sum --check --strict
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/creator-target.json "$SERIES" release --upstream artifacts/trusted/upstream.json --role creator
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/reader-target.json "$SERIES" release --upstream artifacts/trusted/upstream.json --role reader
      - name: Build and verify in FreeBSD
        uses: vmactions/freebsd-vm@v1
        env:
          SERIES: ${{ needs.profile.outputs.series }}
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
          PROFILE_COMMIT: ${{ needs.profile.outputs.profile_commit }}
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: SERIES SOURCE_COMMIT PROFILE_COMMIT CONTROL_COMMIT RP_TRUSTED_DIRECTORY RP_SELECTION_SHA256 RP_TARGET_PKG_METADATA RP_READER_PKG_METADATA
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git
            git config --global --add safe.directory "$PWD"
            RP_UPSTREAM_METADATA=artifacts/trusted/upstream.json .github/ci/ha_dhcp/build-dhcp-interface-ha.sh "$SERIES" "artifacts/$SERIES"
      - id: producer
        uses: actions/upload-artifact@v4
        with:
          name: dhcp-interface-ha-${{ needs.profile.outputs.series }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ needs.profile.outputs.series }}
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [profile, build]
    if: >-
      needs.profile.outputs.release == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.base.ref, 'release/dhcp-interface-ha/') &&
        github.workflow_ref == format('{0}/.github/workflows/ha-dhcp-interface-release.yml@refs/heads/master', github.repository)))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      repository_artifact_id: ${{ steps.repository.outputs.artifact-id }}
      composition_sha256: ${{ steps.seal.outputs.composition_sha256 }}
    env:
      RP_TARGET_PKG_METADATA: artifacts/trusted/creator-target.json
      RP_READER_PKG_METADATA: artifacts/trusted/reader-target.json
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require producer artifact
        run: test -n '${{ needs.build.outputs.producer_artifact_id }}'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.producer_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.profile.outputs.series }}
      - name: Require resolved pkg target artifact
        run: test -n '${{ needs.profile.outputs.target_artifact_id }}'
      - name: Download resolved pkg targets
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.target_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - name: Validate resolved pkg targets
        shell: bash
        env:
          SERIES: ${{ needs.profile.outputs.series }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '${{ needs.profile.outputs.source_commit }}'
          python3 -I .github/ci/ha_dhcp/dhcp_interface_ha_release.py validate-source \
            --series "$SERIES" --directory artifacts/trusted --repository-root "$PWD" \
            --source-commit '${{ needs.profile.outputs.source_commit }}' --control-commit '${{ github.workflow_sha }}' \
            --sha256 '${{ needs.profile.outputs.selection_sha256 }}'
          printf '%s  %s\n' '${{ needs.profile.outputs.creator_target_sha256 }}' artifacts/trusted/creator-target.json '${{ needs.profile.outputs.reader_target_sha256 }}' artifacts/trusted/reader-target.json | sha256sum --check --strict
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/creator-target.json "$SERIES" release --upstream artifacts/trusted/upstream.json --role creator
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/reader-target.json "$SERIES" release --upstream artifacts/trusted/upstream.json --role reader
      - name: Bind source to trusted workflow
        env:
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
          RP_EXPECTED_CONTROL_COMMIT: ${{ github.workflow_sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RP_EXPECTED_CONTROL_COMMIT"
      - name: Reuse immutable signed snapshot
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          SERIES: ${{ needs.profile.outputs.series }}
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
          PROFILE_COMMIT: ${{ needs.profile.outputs.profile_commit }}
        run: |
          set -eu
          (cd "artifacts/$SERIES" && sha256sum --check SHA256SUMS)
          reused=$(python3 .github/ci/ha_dhcp/dhcp_interface_ha_channel.py reuse \
            --directory "artifacts/$SERIES" --output "artifacts/$SERIES/repository/current" \
            --series "$SERIES" --source-commit "$SOURCE_COMMIT" --profile-commit "$PROFILE_COMMIT" --trusted-upstream artifacts/trusted/upstream.json --target-pkg-metadata "$RP_TARGET_PKG_METADATA" --package-definition artifacts/trusted/plugin-package.mk \
            --series-build-inputs artifacts/trusted/series-build-inputs.json --control-commit '${{ github.workflow_sha }}')
          printf 'reused=%s\n' "$reused" >> "$GITHUB_OUTPUT"
      - name: Authenticate and sign the HA package
        uses: vmactions/freebsd-vm@v1
        env:
          RP_PKG_SIGNING_KEY: ${{ secrets.RP_PKG_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          REUSED: ${{ steps.reuse.outputs.reused }}
          SERIES: ${{ needs.profile.outputs.series }}
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
          PROFILE_COMMIT: ${{ needs.profile.outputs.profile_commit }}
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: RP_PKG_SIGNING_KEY GH_TOKEN REUSED SERIES SOURCE_COMMIT PROFILE_COMMIT RP_TARGET_PKG_METADATA RP_READER_PKG_METADATA
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git gh
            git config --global --add safe.directory "$PWD"
            unset RP_OPNSENSE_SNAPSHOT
            python3 -I .github/ci/ha_dhcp/dhcp_interface_ha_channel.py authenticate \
              --directory "artifacts/$SERIES" --series "$SERIES" --source-commit "$SOURCE_COMMIT" --profile-commit "$PROFILE_COMMIT" \
              --trusted-upstream artifacts/trusted/upstream.json --target-pkg-metadata "$RP_TARGET_PKG_METADATA" --package-definition artifacts/trusted/plugin-package.mk \
              --series-build-inputs artifacts/trusted/series-build-inputs.json --control-commit '${{ github.workflow_sha }}'
            umask 077
            key=.rp-dhcpha-signing-key.pem
            trap 'rm -f "$key"' EXIT HUP INT TERM
            printf '%s' "$RP_PKG_SIGNING_KEY" | base64 -d > "$key"
            if [ "$REUSED" != true ]; then
              python3 .github/ci/ha_dhcp/dhcp_interface_ha_channel.py stage \
                --directory "artifacts/$SERIES" --output "artifacts/$SERIES/repository/current" \
                --series "$SERIES" --source-commit "$SOURCE_COMMIT" --profile-commit "$PROFILE_COMMIT" \
                --trusted-upstream artifacts/trusted/upstream.json --key "$key" --target-pkg-metadata "$RP_TARGET_PKG_METADATA" --package-definition artifacts/trusted/plugin-package.mk \
                --series-build-inputs artifacts/trusted/series-build-inputs.json --control-commit '${{ github.workflow_sha }}'
            fi
            python3 -I .github/ci/shared/package_catalogue.py seal-owned \
              --component dhcp --series "$SERIES" --repository-root "artifacts/$SERIES/repository"
            rm -f "$key"
      - name: Seal composition from signer artifact
        id: seal
        env:
          SERIES: ${{ needs.profile.outputs.series }}
        run: |
          set -eu
          composition_sha256=$(sha256sum "artifacts/$SERIES/repository/composition-inputs.json" | cut -d ' ' -f1)
          python3 -I .github/ci/shared/package_catalogue.py validate --repository-root "artifacts/$SERIES/repository" \
            --component dhcp --series "$SERIES" --composition-sha256 "$composition_sha256"
          printf 'composition_sha256=%s\n' "$composition_sha256" >> "$GITHUB_OUTPUT"
      - id: repository
        uses: actions/upload-artifact@v4
        with:
          name: dhcp-interface-ha-signed-${{ needs.profile.outputs.series }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ needs.profile.outputs.series }}/repository
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [profile, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RP_TARGET_PKG_METADATA: artifacts/trusted/creator-target.json
      RP_READER_PKG_METADATA: artifacts/trusted/reader-target.json
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.profile.outputs.control_commit }}
          persist-credentials: false
      - name: Require sealed repository artifact
        run: test -n '${{ needs.sign.outputs.repository_artifact_id }}' && test -n "$RP_COMPOSITION_SHA256"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.profile.outputs.series }}/repository
      - name: Require resolved pkg target artifact
        run: test -n '${{ needs.profile.outputs.target_artifact_id }}'
      - name: Download resolved pkg targets
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.target_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - name: Validate resolved pkg targets
        shell: bash
        env:
          SERIES: ${{ needs.profile.outputs.series }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '${{ needs.profile.outputs.source_commit }}'
          python3 -I .github/ci/ha_dhcp/dhcp_interface_ha_release.py validate-source \
            --series "$SERIES" --directory artifacts/trusted --repository-root "$PWD" \
            --source-commit '${{ needs.profile.outputs.source_commit }}' --control-commit '${{ github.workflow_sha }}' \
            --sha256 '${{ needs.profile.outputs.selection_sha256 }}'
          printf '%s  %s\n' '${{ needs.profile.outputs.creator_target_sha256 }}' artifacts/trusted/creator-target.json '${{ needs.profile.outputs.reader_target_sha256 }}' artifacts/trusted/reader-target.json | sha256sum --check --strict
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/creator-target.json "$SERIES" release --upstream artifacts/trusted/upstream.json --role creator
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/reader-target.json "$SERIES" release --upstream artifacts/trusted/upstream.json --role reader
      - name: Verify signed installation
        uses: vmactions/freebsd-vm@v1
        env:
          SERIES: ${{ needs.profile.outputs.series }}
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: SERIES RP_TARGET_PKG_METADATA RP_READER_PKG_METADATA RP_COMPOSITION_SHA256
          usesh: true
          disable-cache: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git
            expected="artifacts/$SERIES/repository/current"
            combined="$expected"
            RP_UPSTREAM_METADATA=artifacts/trusted/upstream.json .github/ci/ha_dhcp/verify-dhcp-interface-ha.sh \
              "$SERIES" "$expected" "file://$PWD/$combined" "$combined"

  publish:
    needs: [profile, sign, verify]
    if: >-
      needs.profile.outputs.release == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.base.ref, 'release/dhcp-interface-ha/') &&
        github.workflow_ref == format('{0}/.github/workflows/ha-dhcp-interface-release.yml@refs/heads/master', github.repository)))
    runs-on: ubuntu-24.04
    env:
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require sealed repository artifact
        run: test -n '${{ needs.sign.outputs.repository_artifact_id }}' && test -n "$RP_COMPOSITION_SHA256"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.profile.outputs.series }}/repository
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.target_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - name: Validate trusted source and sealed composition before publication
        env:
          SERIES: ${{ needs.profile.outputs.series }}
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
          RP_EXPECTED_CONTROL_COMMIT: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git fetch --no-tags origin '${{ needs.profile.outputs.source_commit }}'
          python3 -I .github/ci/ha_dhcp/dhcp_interface_ha_release.py validate-source \
            --series "$SERIES" --directory artifacts/trusted --repository-root "$PWD" \
            --source-commit '${{ needs.profile.outputs.source_commit }}' --control-commit '${{ github.workflow_sha }}' \
            --sha256 '${{ needs.profile.outputs.selection_sha256 }}'
          test "$(git rev-parse HEAD)" = "$RP_EXPECTED_CONTROL_COMMIT"
          python3 -I .github/ci/shared/package_catalogue.py validate --repository-root "artifacts/$SERIES/repository" \
            --component dhcp --series "$SERIES" --composition-sha256 "$RP_COMPOSITION_SHA256"
          python3 -I .github/ci/ha_dhcp/dhcp_interface_ha_release.py check-peers \
            --series "$SERIES" --repository-root "artifacts/$SERIES/repository" --composition-sha256 "$RP_COMPOSITION_SHA256"
      - name: Mint distribution repository token
        id: distribution-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RP_DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.RP_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: resolver-plugins
          repositories: repository
          permission-contents: write
      - name: Publish signed current and immutable rollback channels
        env:
          SERIES: ${{ needs.profile.outputs.series }}
          GH_TOKEN: ${{ steps.distribution-token.outputs.token }}
        run: |
          set -eu
          python3 .github/ci/ha_dhcp/dhcp_interface_ha_channel.py promote \
            --directory "artifacts/$SERIES/repository/current" --recovery "$RUNNER_TEMP/dhcpha-recovery"
          python3 -I .github/ci/ha_dhcp/dhcp_interface_ha_release.py check-peers \
            --series "$SERIES" --repository-root "artifacts/$SERIES/repository" --composition-sha256 "$RP_COMPOSITION_SHA256" --owned-must-match
      - name: Save publication recovery state
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dhcp-interface-ha-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dhcpha-recovery
            ${{ runner.temp }}/catalogue-recovery
          if-no-files-found: ignore
          retention-days: 7

  verify-published:
    needs: [profile, sign, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RP_TARGET_PKG_METADATA: artifacts/trusted/creator-target.json
      RP_READER_PKG_METADATA: artifacts/trusted/reader-target.json
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.profile.outputs.control_commit }}
          persist-credentials: false
      - name: Require sealed repository artifact
        run: test -n '${{ needs.sign.outputs.repository_artifact_id }}' && test -n "$RP_COMPOSITION_SHA256"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.profile.outputs.series }}/repository
      - name: Require resolved pkg target artifact
        run: test -n '${{ needs.profile.outputs.target_artifact_id }}'
      - name: Download resolved pkg targets
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.target_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - name: Validate resolved pkg targets
        shell: bash
        env:
          SERIES: ${{ needs.profile.outputs.series }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '${{ needs.profile.outputs.source_commit }}'
          python3 -I .github/ci/ha_dhcp/dhcp_interface_ha_release.py validate-source \
            --series "$SERIES" --directory artifacts/trusted --repository-root "$PWD" \
            --source-commit '${{ needs.profile.outputs.source_commit }}' --control-commit '${{ github.workflow_sha }}' \
            --sha256 '${{ needs.profile.outputs.selection_sha256 }}'
          printf '%s  %s\n' '${{ needs.profile.outputs.creator_target_sha256 }}' artifacts/trusted/creator-target.json '${{ needs.profile.outputs.reader_target_sha256 }}' artifacts/trusted/reader-target.json | sha256sum --check --strict
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/creator-target.json "$SERIES" release --upstream artifacts/trusted/upstream.json --role creator
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/reader-target.json "$SERIES" release --upstream artifacts/trusted/upstream.json --role reader
      - name: Verify installation from public signed channel
        uses: vmactions/freebsd-vm@v1
        env:
          SERIES: ${{ needs.profile.outputs.series }}
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: SERIES RP_TARGET_PKG_METADATA RP_READER_PKG_METADATA RP_COMPOSITION_SHA256
          usesh: true
          disable-cache: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git
            expected="artifacts/$SERIES/repository/current"
            combined="$expected"
            RP_UPSTREAM_METADATA=artifacts/trusted/upstream.json .github/ci/ha_dhcp/verify-dhcp-interface-ha.sh \
              "$SERIES" "$expected" "https://github.com/resolver-plugins/repository/releases/download/pkg-dhcp-interface-ha-$SERIES" "$combined"

  source-release:
    needs: [profile, sign, verify-published]
    if: >-
      needs.profile.outputs.release == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.base.ref, 'release/dhcp-interface-ha/') &&
        github.workflow_ref == format('{0}/.github/workflows/ha-dhcp-interface-release.yml@refs/heads/master', github.repository)))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require sealed repository artifact
        run: test -n '${{ needs.sign.outputs.repository_artifact_id }}' && test -n "$RP_COMPOSITION_SHA256"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.profile.outputs.series }}/repository
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.profile.outputs.target_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - name: Validate trusted source and sealed composition before source release
        env:
          SERIES: ${{ needs.profile.outputs.series }}
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
          RP_EXPECTED_CONTROL_COMMIT: ${{ github.workflow_sha }}
        run: |
          set -eu
          git fetch --no-tags origin '${{ needs.profile.outputs.source_commit }}'
          python3 -I .github/ci/ha_dhcp/dhcp_interface_ha_release.py validate-source \
            --series "$SERIES" --directory artifacts/trusted --repository-root "$PWD" \
            --source-commit '${{ needs.profile.outputs.source_commit }}' --control-commit '${{ github.workflow_sha }}' \
            --sha256 '${{ needs.profile.outputs.selection_sha256 }}'
          test "$(git rev-parse HEAD)" = "$RP_EXPECTED_CONTROL_COMMIT"
          python3 -I .github/ci/shared/package_catalogue.py validate --repository-root "artifacts/$SERIES/repository" \
            --component dhcp --series "$SERIES" --composition-sha256 "$RP_COMPOSITION_SHA256"
      - name: Publish verified source prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SERIES: ${{ needs.profile.outputs.series }}
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
        run: |
          set -eu
          source_output="$RUNNER_TEMP/dhcpha-source"
          mkdir "$source_output"
          cp "artifacts/$SERIES/repository/current/"os-dhcp-interface-ha-*.pkg "artifacts/$SERIES/repository/current/build-metadata.txt" "artifacts/$SERIES/repository/current/upstream.json" "artifacts/$SERIES/repository/current/series-build-inputs.json" "$source_output/"
          (cd "$source_output" && sha256sum ./*.pkg build-metadata.txt upstream.json series-build-inputs.json > SHA256SUMS)
          python3 .github/ci/ha_dhcp/publish-dhcp-interface-ha.py \
            --repository "$GITHUB_REPOSITORY" --directory "$source_output" \
            --series "$SERIES" --source-commit "$SOURCE_COMMIT"
