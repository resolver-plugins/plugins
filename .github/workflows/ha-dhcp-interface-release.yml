name: Publish HA DHCP Interface package release

on:
  push:
    branches: [master]
    paths: ['net/dhcp-interface-ha/Makefile']
  workflow_dispatch:
    inputs:
      series:
        description: OPNsense series with an existing reviewed release profile
        type: choice
        options: ['26.7']
        default: '26.7'
        required: true

permissions:
  contents: read

concurrency:
  group: package-release
  cancel-in-progress: false
  queue: max

jobs:
  test:
    needs: profile
    if: needs.profile.outputs.release == 'true'
    uses: ./.github/workflows/ha-dhcp-interface-tests.yml

  profile:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.select.outputs.release }}
      series: ${{ steps.select.outputs.series }}
      source_commit: ${{ steps.select.outputs.source_commit }}
      profile_commit: ${{ steps.profile.outputs.profile_commit }}
      freebsd_release: ${{ steps.profile.outputs.freebsd_release }}
      target_artifact_id: ${{ steps.pkg-targets.outputs.artifact-id }}
      creator_target_sha256: ${{ steps.profile.outputs.creator_target_sha256 }}
      reader_target_sha256: ${{ steps.profile.outputs.reader_target_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select new version or manual retry
        id: select
        env:
          SERIES: ${{ inputs.series || '26.7' }}
        run: python3 .github/ci/ha_dhcp/dhcp_interface_ha_release.py select --series "$SERIES" >> "$GITHUB_OUTPUT"
      - id: profile
        if: steps.select.outputs.release == 'true'
        env:
          SERIES: ${{ steps.select.outputs.series }}
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/master
          test "$SERIES" = 26.7
          git fetch --no-tags origin "refs/heads/release/bind-rp/$SERIES:refs/remotes/origin/ha-build-profile"
          profile_commit=$(git rev-parse refs/remotes/origin/ha-build-profile)
          git show "$profile_commit:.resolver-plugins/upstream.json" > "$RUNNER_TEMP/upstream.json"
          freebsd_release=$(python3 .github/ci/shared/metadata_profile.py "$RUNNER_TEMP/upstream.json" "$SERIES" freebsd_release)
          printf 'profile_commit=%s\nfreebsd_release=%s\n' "$profile_commit" "$freebsd_release" >> "$GITHUB_OUTPUT"

          python3 .github/ci/shared/target_pkg.py resolve --upstream "$RUNNER_TEMP/upstream.json" --series "$SERIES" --architecture x86_64 --output-directory artifacts/trusted
          printf 'creator_target_sha256=%s\nreader_target_sha256=%s\n' "$(sha256sum artifacts/trusted/creator-target.json | cut -d ' ' -f1)" "$(sha256sum artifacts/trusted/reader-target.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: pkg-targets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.select.outputs.release == 'true'
        with:
          name: pkg-targets-dhcp-${{ steps.select.outputs.series }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/trusted/creator-target.json
            artifacts/trusted/reader-target.json
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [profile, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      producer_artifact_id: ${{ steps.producer.outputs.artifact-id }}
    env:
      RP_TARGET_PKG_METADATA: artifacts/trusted/creator-target.json
      RP_READER_PKG_METADATA: artifacts/trusted/reader-target.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.profile.outputs.source_commit }}
          persist-credentials: false
      - name: Materialize pinned compatibility profile
        env:
          PROFILE_COMMIT: ${{ needs.profile.outputs.profile_commit }}
        run: |
          set -eu
          git fetch --no-tags origin "$PROFILE_COMMIT"
          mkdir -p artifacts/profile
          git show "$PROFILE_COMMIT:.resolver-plugins/upstream.json" > artifacts/profile/upstream.json
      - name: Require resolved pkg target artifact
        run: test -n '${{ needs.profile.outputs.target_artifact_id }}'
      - name: Download resolved pkg targets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.profile.outputs.target_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - name: Validate resolved pkg targets
        shell: bash
        env:
          SERIES: ${{ needs.profile.outputs.series }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' '${{ needs.profile.outputs.creator_target_sha256 }}' artifacts/trusted/creator-target.json '${{ needs.profile.outputs.reader_target_sha256 }}' artifacts/trusted/reader-target.json | sha256sum --check --strict
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/creator-target.json "$SERIES" release --upstream artifacts/profile/upstream.json --role creator
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/reader-target.json "$SERIES" release --upstream artifacts/profile/upstream.json --role reader
      - name: Build and verify in FreeBSD
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d
        env:
          SERIES: ${{ needs.profile.outputs.series }}
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
          PROFILE_COMMIT: ${{ needs.profile.outputs.profile_commit }}
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: SERIES SOURCE_COMMIT PROFILE_COMMIT RP_TARGET_PKG_METADATA RP_READER_PKG_METADATA
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git
            git config --global --add safe.directory "$PWD"
            RP_UPSTREAM_METADATA=artifacts/profile/upstream.json .github/ci/ha_dhcp/build-dhcp-interface-ha.sh "$SERIES" "artifacts/$SERIES"
      - id: producer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dhcp-interface-ha-${{ needs.profile.outputs.series }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ needs.profile.outputs.series }}
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [profile, build]
    if: needs.profile.outputs.release == 'true' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      repository_artifact_id: ${{ steps.repository.outputs.artifact-id }}
      composition_sha256: ${{ steps.seal.outputs.composition_sha256 }}
    env:
      RP_TARGET_PKG_METADATA: artifacts/trusted/creator-target.json
      RP_READER_PKG_METADATA: artifacts/trusted/reader-target.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require producer artifact
        run: test -n '${{ needs.build.outputs.producer_artifact_id }}'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.producer_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.profile.outputs.series }}
      - name: Materialize trusted profile
        env:
          PROFILE_COMMIT: ${{ needs.profile.outputs.profile_commit }}
        run: |
          set -eu
          git fetch --no-tags origin "$PROFILE_COMMIT"
          mkdir -p artifacts/trusted
          git show "$PROFILE_COMMIT:.resolver-plugins/upstream.json" > artifacts/trusted/upstream.json
      - name: Require resolved pkg target artifact
        run: test -n '${{ needs.profile.outputs.target_artifact_id }}'
      - name: Download resolved pkg targets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.profile.outputs.target_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - name: Validate resolved pkg targets
        shell: bash
        env:
          SERIES: ${{ needs.profile.outputs.series }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' '${{ needs.profile.outputs.creator_target_sha256 }}' artifacts/trusted/creator-target.json '${{ needs.profile.outputs.reader_target_sha256 }}' artifacts/trusted/reader-target.json | sha256sum --check --strict
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/creator-target.json "$SERIES" release --upstream artifacts/trusted/upstream.json --role creator
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/reader-target.json "$SERIES" release --upstream artifacts/trusted/upstream.json --role reader
      - name: Bind source to trusted workflow
        env:
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
          RP_EXPECTED_CONTROL_COMMIT: ${{ github.workflow_sha }}
        run: |
          set -eu
          test "$SOURCE_COMMIT" = "$RP_EXPECTED_CONTROL_COMMIT"
          test "$(git rev-parse HEAD)" = "$RP_EXPECTED_CONTROL_COMMIT"
      - name: Reuse immutable signed snapshot
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          SERIES: ${{ needs.profile.outputs.series }}
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
          PROFILE_COMMIT: ${{ needs.profile.outputs.profile_commit }}
        run: |
          set -eu
          (cd "artifacts/$SERIES" && sha256sum --check SHA256SUMS)
          reused=$(python3 .github/ci/ha_dhcp/dhcp_interface_ha_channel.py reuse \
            --directory "artifacts/$SERIES" --output "artifacts/$SERIES/repository/current" \
            --series "$SERIES" --source-commit "$SOURCE_COMMIT" --profile-commit "$PROFILE_COMMIT" --trusted-upstream artifacts/trusted/upstream.json --target-pkg-metadata "$RP_TARGET_PKG_METADATA")
          printf 'reused=%s\n' "$reused" >> "$GITHUB_OUTPUT"
      - name: Fetch published BIND runtime and plugin components
        env:
          GH_TOKEN: ${{ github.token }}
          SERIES: ${{ needs.profile.outputs.series }}
        run: |
          set -eu
          python3 -I .github/ci/shared/package_catalogue.py fetch --component bind_runtime --series "$SERIES" --output "artifacts/$SERIES/bind-runtime"
          python3 -I .github/ci/shared/package_catalogue.py fetch --component bind_plugin --series "$SERIES" --output "artifacts/$SERIES/bind-plugin"
      - name: Sign isolated plugin and shared catalogues
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d
        env:
          RP_PKG_SIGNING_KEY: ${{ secrets.RP_PKG_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          REUSED: ${{ steps.reuse.outputs.reused }}
          SERIES: ${{ needs.profile.outputs.series }}
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
          PROFILE_COMMIT: ${{ needs.profile.outputs.profile_commit }}
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: RP_PKG_SIGNING_KEY GH_TOKEN REUSED SERIES SOURCE_COMMIT PROFILE_COMMIT RP_TARGET_PKG_METADATA RP_READER_PKG_METADATA
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git gh
            git config --global --add safe.directory "$PWD"
            RP_OPNSENSE_SNAPSHOT=$(python3 .github/ci/ha_dhcp/dhcp_interface_ha_release.py snapshot --series "$SERIES")
            export RP_OPNSENSE_SNAPSHOT
            python3 -I - "$SERIES" <<'PY'
            import os
            import sys
            from pathlib import Path
            sys.path.insert(0, str(Path('.github/ci').resolve()))
            from bind.shared import components
            from shared import package_catalogue
            series = sys.argv[1]
            upstream = Path('artifacts/trusted/upstream.json')
            reader = Path(os.environ['RP_READER_PKG_METADATA'])
            pkg = '/usr/local/sbin/pkg-static'
            components.select_role(upstream, reader, series, 'reader', pkg)
            package_catalogue.authenticate_components(
                Path('artifacts') / series / 'bind-runtime',
                Path('artifacts') / series / 'bind-plugin', None,
                series=series, reader_target=reader, upstream=upstream, pkg_command=pkg)
            components.select_role(upstream, Path(os.environ['RP_TARGET_PKG_METADATA']), series, 'creator', pkg)
            PY
            umask 077
            key=.rp-dhcpha-signing-key.pem
            trap 'rm -f "$key"' EXIT HUP INT TERM
            printf '%s' "$RP_PKG_SIGNING_KEY" | base64 -d > "$key"
            if [ "$REUSED" != true ]; then
              python3 .github/ci/ha_dhcp/dhcp_interface_ha_channel.py stage \
                --directory "artifacts/$SERIES" --output "artifacts/$SERIES/repository/current" \
                --series "$SERIES" --source-commit "$SOURCE_COMMIT" --profile-commit "$PROFILE_COMMIT" \
                --trusted-upstream artifacts/trusted/upstream.json --key "$key" --target-pkg-metadata "$RP_TARGET_PKG_METADATA"
            fi
            python3 .github/ci/shared/package_catalogue.py stage \
              --runtime-channel "artifacts/$SERIES/bind-runtime" --plugin-channel "artifacts/$SERIES/bind-plugin" \
              --dhcp-channel "artifacts/$SERIES/repository/current" --output "artifacts/$SERIES/repository/combined" \
              --series "$SERIES" --key "$key" --creator-target "$RP_TARGET_PKG_METADATA" --upstream artifacts/trusted/upstream.json \
              --owner dhcp --composition-output "artifacts/$SERIES/repository/composition-inputs.json" --repository resolver-plugins/repository
            rm -f "$key"
      - name: Seal composition from signer artifact
        id: seal
        env:
          SERIES: ${{ needs.profile.outputs.series }}
        run: |
          set -eu
          composition_sha256=$(sha256sum "artifacts/$SERIES/repository/composition-inputs.json" | cut -d ' ' -f1)
          python3 -I .github/ci/shared/package_catalogue.py validate --repository-root "artifacts/$SERIES/repository" \
            --component dhcp --series "$SERIES" --composition-sha256 "$composition_sha256"
          printf 'composition_sha256=%s\n' "$composition_sha256" >> "$GITHUB_OUTPUT"
      - id: repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dhcp-interface-ha-signed-${{ needs.profile.outputs.series }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ needs.profile.outputs.series }}/repository
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [profile, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RP_TARGET_PKG_METADATA: artifacts/trusted/creator-target.json
      RP_READER_PKG_METADATA: artifacts/trusted/reader-target.json
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.profile.outputs.source_commit }}
          persist-credentials: false
      - name: Require sealed repository artifact
        run: test -n '${{ needs.sign.outputs.repository_artifact_id }}' && test -n "$RP_COMPOSITION_SHA256"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.profile.outputs.series }}/repository
      - name: Materialize trusted profile
        env:
          PROFILE_COMMIT: ${{ needs.profile.outputs.profile_commit }}
        run: |
          set -eu
          git fetch --no-tags origin "$PROFILE_COMMIT"
          mkdir -p artifacts/trusted
          git show "$PROFILE_COMMIT:.resolver-plugins/upstream.json" > artifacts/trusted/upstream.json
      - name: Require resolved pkg target artifact
        run: test -n '${{ needs.profile.outputs.target_artifact_id }}'
      - name: Download resolved pkg targets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.profile.outputs.target_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - name: Validate resolved pkg targets
        shell: bash
        env:
          SERIES: ${{ needs.profile.outputs.series }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' '${{ needs.profile.outputs.creator_target_sha256 }}' artifacts/trusted/creator-target.json '${{ needs.profile.outputs.reader_target_sha256 }}' artifacts/trusted/reader-target.json | sha256sum --check --strict
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/creator-target.json "$SERIES" release --upstream artifacts/trusted/upstream.json --role creator
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/reader-target.json "$SERIES" release --upstream artifacts/trusted/upstream.json --role reader
      - name: Verify signed installation
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d
        env:
          SERIES: ${{ needs.profile.outputs.series }}
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: SERIES RP_TARGET_PKG_METADATA RP_READER_PKG_METADATA RP_COMPOSITION_SHA256
          usesh: true
          disable-cache: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git
            expected="artifacts/$SERIES/repository/current"
            combined="artifacts/$SERIES/repository/combined"
            RP_UPSTREAM_METADATA=artifacts/trusted/upstream.json .github/ci/ha_dhcp/verify-dhcp-interface-ha.sh \
              "$SERIES" "$expected" "file://$PWD/$combined" "$combined"

  publish:
    needs: [profile, sign, verify]
    if: needs.profile.outputs.release == 'true' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    env:
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require sealed repository artifact
        run: test -n '${{ needs.sign.outputs.repository_artifact_id }}' && test -n "$RP_COMPOSITION_SHA256"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.profile.outputs.series }}/repository
      - name: Validate trusted source and sealed composition before publication
        env:
          SERIES: ${{ needs.profile.outputs.series }}
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
          RP_EXPECTED_CONTROL_COMMIT: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$SOURCE_COMMIT" = "$RP_EXPECTED_CONTROL_COMMIT"
          test "$(git rev-parse HEAD)" = "$RP_EXPECTED_CONTROL_COMMIT"
          python3 -I .github/ci/shared/package_catalogue.py validate --repository-root "artifacts/$SERIES/repository" \
            --component dhcp --series "$SERIES" --composition-sha256 "$RP_COMPOSITION_SHA256"
          python3 -I - "$SERIES" <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.github/ci').resolve()))
          from bind.shared import components
          composition = components.load_composition(
              Path('artifacts') / sys.argv[1] / 'repository', component='dhcp',
              series=sys.argv[1], composition_sha256=os.environ['RP_COMPOSITION_SHA256'])
          components.check_composition_peers('resolver-plugins/repository', composition)
          PY
      - name: Mint distribution repository token
        id: distribution-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.RP_DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.RP_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: resolver-plugins
          repositories: repository
          permission-contents: write
      - name: Publish signed current and immutable rollback channels
        env:
          SERIES: ${{ needs.profile.outputs.series }}
          GH_TOKEN: ${{ steps.distribution-token.outputs.token }}
        run: |
          set -eu
          python3 .github/ci/ha_dhcp/dhcp_interface_ha_channel.py promote \
            --directory "artifacts/$SERIES/repository/current" --recovery "$RUNNER_TEMP/dhcpha-recovery"
          python3 -I - "$SERIES" <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.github/ci').resolve()))
          from bind.shared import components
          composition = components.load_composition(
              Path('artifacts') / sys.argv[1] / 'repository', component='dhcp',
              series=sys.argv[1], composition_sha256=os.environ['RP_COMPOSITION_SHA256'])
          components.check_composition_peers('resolver-plugins/repository', composition, owned_must_match=True)
          PY
          python3 .github/ci/shared/package_catalogue.py publish \
            --repository-root "artifacts/$SERIES/repository" --component dhcp --series "$SERIES" \
            --composition-sha256 "$RP_COMPOSITION_SHA256" --repository resolver-plugins/repository --recovery "$RUNNER_TEMP/catalogue-recovery"
      - name: Save publication recovery state
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dhcp-interface-ha-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dhcpha-recovery
            ${{ runner.temp }}/catalogue-recovery
          if-no-files-found: ignore
          retention-days: 7

  verify-published:
    needs: [profile, sign, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RP_TARGET_PKG_METADATA: artifacts/trusted/creator-target.json
      RP_READER_PKG_METADATA: artifacts/trusted/reader-target.json
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.profile.outputs.source_commit }}
          persist-credentials: false
      - name: Require sealed repository artifact
        run: test -n '${{ needs.sign.outputs.repository_artifact_id }}' && test -n "$RP_COMPOSITION_SHA256"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.profile.outputs.series }}/repository
      - name: Materialize trusted profile
        env:
          PROFILE_COMMIT: ${{ needs.profile.outputs.profile_commit }}
        run: |
          set -eu
          git fetch --no-tags origin "$PROFILE_COMMIT"
          mkdir -p artifacts/trusted
          git show "$PROFILE_COMMIT:.resolver-plugins/upstream.json" > artifacts/trusted/upstream.json
      - name: Require resolved pkg target artifact
        run: test -n '${{ needs.profile.outputs.target_artifact_id }}'
      - name: Download resolved pkg targets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.profile.outputs.target_artifact_id }}
          merge-multiple: true
          path: artifacts/trusted
      - name: Validate resolved pkg targets
        shell: bash
        env:
          SERIES: ${{ needs.profile.outputs.series }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' '${{ needs.profile.outputs.creator_target_sha256 }}' artifacts/trusted/creator-target.json '${{ needs.profile.outputs.reader_target_sha256 }}' artifacts/trusted/reader-target.json | sha256sum --check --strict
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/creator-target.json "$SERIES" release --upstream artifacts/trusted/upstream.json --role creator
          python3 .github/ci/shared/target_pkg.py field artifacts/trusted/reader-target.json "$SERIES" release --upstream artifacts/trusted/upstream.json --role reader
      - name: Verify installation from public signed channel
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d
        env:
          SERIES: ${{ needs.profile.outputs.series }}
        with:
          release: ${{ needs.profile.outputs.freebsd_release }}
          arch: x86_64
          envs: SERIES RP_TARGET_PKG_METADATA RP_READER_PKG_METADATA RP_COMPOSITION_SHA256
          usesh: true
          disable-cache: true
          run: |
            set -eu
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y python3 git
            expected="artifacts/$SERIES/repository/current"
            combined="artifacts/$SERIES/repository/combined"
            RP_UPSTREAM_METADATA=artifacts/trusted/upstream.json .github/ci/ha_dhcp/verify-dhcp-interface-ha.sh \
              "$SERIES" "$expected" "https://resolver-plugins.github.io/repository/pkg/FreeBSD:15:amd64/$SERIES/latest" "$combined"

  source-release:
    needs: [profile, sign, verify-published]
    if: needs.profile.outputs.release == 'true' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RP_COMPOSITION_SHA256: ${{ needs.sign.outputs.composition_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require sealed repository artifact
        run: test -n '${{ needs.sign.outputs.repository_artifact_id }}' && test -n "$RP_COMPOSITION_SHA256"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.sign.outputs.repository_artifact_id }}
          merge-multiple: true
          path: artifacts/${{ needs.profile.outputs.series }}/repository
      - name: Validate trusted source and sealed composition before source release
        env:
          SERIES: ${{ needs.profile.outputs.series }}
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
          RP_EXPECTED_CONTROL_COMMIT: ${{ github.workflow_sha }}
        run: |
          set -eu
          test "$SOURCE_COMMIT" = "$RP_EXPECTED_CONTROL_COMMIT"
          test "$(git rev-parse HEAD)" = "$RP_EXPECTED_CONTROL_COMMIT"
          python3 -I .github/ci/shared/package_catalogue.py validate --repository-root "artifacts/$SERIES/repository" \
            --component dhcp --series "$SERIES" --composition-sha256 "$RP_COMPOSITION_SHA256"
      - name: Publish verified source prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SERIES: ${{ needs.profile.outputs.series }}
          SOURCE_COMMIT: ${{ needs.profile.outputs.source_commit }}
        run: |
          set -eu
          source_output="$RUNNER_TEMP/dhcpha-source"
          mkdir "$source_output"
          cp "artifacts/$SERIES/repository/current/"os-dhcp-interface-ha-*.pkg "artifacts/$SERIES/repository/current/build-metadata.txt" "artifacts/$SERIES/repository/current/upstream.json" "$source_output/"
          (cd "$source_output" && sha256sum ./*.pkg build-metadata.txt upstream.json > SHA256SUMS)
          python3 .github/ci/ha_dhcp/publish-dhcp-interface-ha.py \
            --repository "$GITHUB_REPOSITORY" --directory "$source_output" \
            --series "$SERIES" --source-commit "$SOURCE_COMMIT"
