name: Build os-bind-rp 26.1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-26-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build in FreeBSD 14.3
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d
        with:
          release: "14.3"
          arch: x86_64
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            SOURCE_COMMIT='${{ github.sha }}' tools/ci/build-os-bind-rp.sh 26.1 artifacts/26.1
      - name: Upload 26.1 build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: os-bind-rp-26.1
          path: artifacts/26.1
          retention-days: 7

  build-26-7:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build in FreeBSD 14.3
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d
        with:
          release: "15.1"
          arch: x86_64
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            SOURCE_COMMIT='${{ github.sha }}' tools/ci/build-os-bind-rp.sh 26.7 artifacts/26.7
      - name: Upload 26.7 build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: os-bind-rp-26.7
          path: artifacts/26.7
          retention-days: 7
