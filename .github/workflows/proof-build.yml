name: Prove os-bind-rp package build

on:
  workflow_dispatch:
    inputs:
      series:
        description: OPNsense release series to prove
        required: true
        type: choice
        options:
          - "26.1"
          - "26.7"

permissions:
  contents: read
  actions: read

jobs:
  proof-26-1:
    if: inputs.series == '26.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build in FreeBSD 14.3
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d
        with:
          release: "14.3"
          arch: x86_64
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            SOURCE_COMMIT='${{ github.sha }}' tools/ci/build-os-bind-rp.sh 26.1 artifacts/26.1
      - name: Upload 26.1 proof artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: os-bind-rp-proof-26.1
          path: artifacts/26.1
          retention-days: 7

  proof-26-7:
    if: inputs.series == '26.7'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build in FreeBSD 15.1
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d
        with:
          release: "15.1"
          arch: x86_64
          usesh: true
          disable-cache: true
          copyback: true
          run: |
            SOURCE_COMMIT='${{ github.sha }}' tools/ci/build-os-bind-rp.sh 26.7 artifacts/26.7
      - name: Upload 26.7 proof artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: os-bind-rp-proof-26.7
          path: artifacts/26.7
          retention-days: 7
