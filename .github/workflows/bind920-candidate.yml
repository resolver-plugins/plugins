name: Propose bind920 candidate

on:
  workflow_dispatch:
    inputs:
      package:
        description: Runtime package whose next BIND version is being proposed
        required: true
        default: bind920
        type: choice
        options: [bind920, bind-tools]
      ports_ref:
        description: FreeBSD Ports ref to inspect
        required: false
        default: main
        type: string
      changelog_text:
        description: Optional maintainer-supplied BIND changelog or security notes
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  RUNTIME_APPROVAL: packages/${{ inputs.package }}/Makefile

jobs:
  propose:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Fetch FreeBSD Ports candidate
        id: ports
        shell: bash
        env:
          PORTS_REF: ${{ inputs.ports_ref }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/freebsd/freebsd-ports.git "$RUNNER_TEMP/freebsd-ports"
          git -C "$RUNNER_TEMP/freebsd-ports" fetch --no-tags origin "$PORTS_REF"
          candidate_commit=$(git -C "$RUNNER_TEMP/freebsd-ports" rev-parse FETCH_HEAD)
          git -C "$RUNNER_TEMP/freebsd-ports" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/freebsd-ports" sparse-checkout set dns/bind920
          git -C "$RUNNER_TEMP/freebsd-ports" checkout "$candidate_commit"
          current_commit=$(python3 -I .github/ci/bind/runtime/bind920_profile.py approval-field \
            --runtime-approval "$RUNTIME_APPROVAL" --field ports_commit)
          git -C "$RUNNER_TEMP/freebsd-ports" fetch --no-tags origin "$current_commit"
          git -C "$RUNNER_TEMP/freebsd-ports" show "$current_commit:dns/bind920/Makefile" > "$RUNNER_TEMP/current.Makefile"
          git -C "$RUNNER_TEMP/freebsd-ports" diff --no-ext-diff "$current_commit" "$candidate_commit" -- dns/bind920 > "$RUNNER_TEMP/ports.diff"
          git -C "$RUNNER_TEMP/freebsd-ports" log --format='%h %s' "$current_commit..$candidate_commit" -- dns/bind920 > "$RUNNER_TEMP/ports.log"
          {
            printf 'candidate_commit=%s\n' "$candidate_commit"
            printf 'current_commit=%s\n' "$current_commit"
            printf 'ports_dir=%s\n' "$RUNNER_TEMP/freebsd-ports"
            printf 'ports_diff=%s\n' "$RUNNER_TEMP/ports.diff"
            printf 'ports_log=%s\n' "$RUNNER_TEMP/ports.log"
            printf 'current_makefile=%s\n' "$RUNNER_TEMP/current.Makefile"
          } >> "$GITHUB_OUTPUT"
      - name: Evaluate candidate
        id: candidate
        shell: bash
        env:
          PORTS_REPOSITORY: https://github.com/freebsd/freebsd-ports.git
          CANDIDATE_COMMIT: ${{ steps.ports.outputs.candidate_commit }}
          PORTS_DIR: ${{ steps.ports.outputs.ports_dir }}
        run: |
          set -euo pipefail
          python3 .github/ci/bind920_candidate.py evaluate --package '${{ inputs.package }}' \
            --makefile "$RUNTIME_APPROVAL" --ports-directory "$PORTS_DIR" \
            --ports-repository "$PORTS_REPOSITORY" --ports-commit "$CANDIDATE_COMMIT" \
            --output "$GITHUB_OUTPUT"
      - name: Stop when no newer candidate exists
        if: steps.candidate.outputs.newer != 'true'
        run: echo "No newer BIND 9.20 candidate found."
      - name: Update approval and create assessment
        if: steps.candidate.outputs.newer == 'true'
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ steps.ports.outputs.candidate_commit }}
          CHANGELOG_TEXT: ${{ inputs.changelog_text }}
          PORTS_DIR: ${{ steps.ports.outputs.ports_dir }}
          PORTS_DIFF: ${{ steps.ports.outputs.ports_diff }}
          PORTS_LOG: ${{ steps.ports.outputs.ports_log }}
          CURRENT_MAKEFILE: ${{ steps.ports.outputs.current_makefile }}
          BIND_UPSTREAM_REPOSITORY: https://github.com/isc-projects/bind9.git
        run: |
          set -euo pipefail
          printf '%s\n' "$CHANGELOG_TEXT" > "$RUNNER_TEMP/maintainer-notes.txt"
          {
            printf 'FreeBSD Ports dns/bind920 commits:\n'
            cat "$PORTS_LOG"
            printf '\nMaintainer-supplied notes:\n'
            cat "$RUNNER_TEMP/maintainer-notes.txt"
          } > "$RUNNER_TEMP/changelog.txt"
          python3 .github/ci/bind920_candidate.py update-approval \
            --makefile "$RUNTIME_APPROVAL" \
            --ports-commit "$CANDIDATE_COMMIT" \
            --version '${{ steps.candidate.outputs.package_version }}'
          python3 .github/ci/bind920_candidate.py assess \
            --old-version '${{ steps.candidate.outputs.old_version }}' \
            --new-version '${{ steps.candidate.outputs.new_version }}' \
            --changelog "$RUNNER_TEMP/changelog.txt" \
            --ports-diff "$PORTS_DIFF" \
            --old-makefile "$CURRENT_MAKEFILE" \
            --new-makefile "$PORTS_DIR/dns/bind920/Makefile" \
            --output "$RUNNER_TEMP/assessment.md"
          old_tag=$(python3 .github/ci/bind920_candidate.py upstream-tag \
            --version '${{ steps.candidate.outputs.old_distversion }}')
          new_tag=$(python3 .github/ci/bind920_candidate.py upstream-tag \
            --version '${{ steps.candidate.outputs.candidate_distversion }}')
          upstream_empty_message="No upstream BIND commits were found between $old_tag and $new_tag."
          if git clone --filter=blob:none --no-checkout "$BIND_UPSTREAM_REPOSITORY" "$RUNNER_TEMP/bind9" \
              && git -C "$RUNNER_TEMP/bind9" fetch --no-tags origin \
                "refs/tags/$old_tag:refs/tags/$old_tag" \
                "refs/tags/$new_tag:refs/tags/$new_tag"; then
            git -C "$RUNNER_TEMP/bind9" log --format='%h %s' "$old_tag..$new_tag" > "$RUNNER_TEMP/upstream.log"
          else
            upstream_empty_message="Could not resolve upstream BIND release tags."
            : > "$RUNNER_TEMP/upstream.log"
          fi
          python3 .github/ci/bind920_candidate.py render-commit-log \
            --title "Upstream BIND Changes" \
            --commits "$RUNNER_TEMP/upstream.log" \
            --empty-message "$upstream_empty_message" \
            --output "$RUNNER_TEMP/upstream-changes.md"
          python3 .github/ci/bind920_candidate.py render-commit-log \
            --title "FreeBSD Ports Changes" \
            --commits "$PORTS_LOG" \
            --empty-message "No dns/bind920 commits found between the pinned and candidate Ports commits." \
            --output "$RUNNER_TEMP/ports-changes.md"
          {
            cat "$RUNNER_TEMP/assessment.md"
            printf '\n'
            cat "$RUNNER_TEMP/upstream-changes.md"
            printf '\n'
            cat "$RUNNER_TEMP/ports-changes.md"
            printf '\n### Candidate Inputs\n\n'
            printf -- '- FreeBSD Ports commit: `%s`\n' "$CANDIDATE_COMMIT"
            printf -- '- Previous FreeBSD Ports commit: `%s`\n' '${{ steps.ports.outputs.current_commit }}'
            printf -- '- New BIND version: `%s`\n' '${{ steps.candidate.outputs.package_version }}'
            printf -- '- Publication: not performed by this workflow\n'
          } > "$RUNNER_TEMP/pr-body.md"
      - name: Authenticate candidate review automation
        if: steps.candidate.outputs.newer == 'true'
        id: review-token
        uses: actions/create-github-app-token@v2
        with:
          client-id: ${{ vars.RP_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.RP_SYNC_APP_PRIVATE_KEY }}
          owner: resolver-plugins
          repositories: plugins
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update candidate PR
        if: steps.candidate.outputs.newer == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.review-token.outputs.token }}
        run: |
          set -euo pipefail
          version="${{ steps.candidate.outputs.package_version }}"
          distversion="${{ steps.candidate.outputs.candidate_distversion }}"
          revision='${{ steps.candidate.outputs.portrevision }}'
          branch="sync/${{ inputs.package }}/$distversion-$revision"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -B "$branch"
          git add "$RUNTIME_APPROVAL"
          if git diff --cached --quiet; then
            echo "Candidate approval is unchanged."
            exit 0
          fi
          git commit -m "ci(bind): update ${{ inputs.package }} to ${version}"
          git -c http.https://github.com/.extraheader= -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force-with-lease origin "$branch"
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --json number --jq '.[0].number // empty')
          title="ci(bind): update ${{ inputs.package }} to ${version}"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            if ! gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"; then
              url="https://github.com/$GITHUB_REPOSITORY/pull/new/$branch"
              {
                printf '### Candidate PR branch created\n\n'
                printf 'GitHub Actions could not create the pull request automatically. Open it manually: %s\n' "$url"
              } >> "$GITHUB_STEP_SUMMARY"
              printf 'Candidate PR branch created. Open it manually: %s\n' "$url"
            fi
          fi
