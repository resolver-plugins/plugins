name: Refresh signed package repository index

on:
  workflow_run:
    workflows: [Publish bind-tools release, Publish bind920 release, Publish BIND plugin release, Publish HA DHCP Interface package release]
    types: [completed]
  workflow_dispatch:
    inputs:
      series:
        description: OPNsense series; leave empty to inspect all registered series
        required: false
        type: string

permissions:
  contents: read

# Only index writers share this lock; package builds and releases never acquire it.
concurrency:
  group: package-repository-index
  cancel-in-progress: false
  queue: max

jobs:
  discover:
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'pull_request_target' ||
         (github.event.workflow_run.head_branch == 'master' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))))
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.series.outputs.matrix }}
    steps:
      - id: series
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SERIES: ${{ inputs.series }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          pages = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp',
              f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/matching-refs/heads/release/'], text=True))
          series = sorted({match[1] for page in pages for record in page if
              (match := re.fullmatch(r'refs/heads/release/(?:bind-rp|dhcp-interface-ha)/(\d+\.\d+)', record['ref']))},
              key=lambda value: tuple(map(int, value.split('.'))))
          requested = os.environ.get('REQUESTED_SERIES')
          if requested and requested not in series:
              raise SystemExit('unregistered index series')
          values = [dict(series=value) for value in series if not requested or value == requested]
          if not values:
              raise SystemExit('no registered index series')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps(dict(include=values), separators=(',', ':')), file=output)
          PY
  refresh:
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/repository-index-series.yml
    with:
      series: ${{ matrix.series }}
    secrets:
      RP_PKG_SIGNING_KEY: ${{ secrets.RP_PKG_SIGNING_KEY }}
      RP_DISTRIBUTION_APP_PRIVATE_KEY: ${{ secrets.RP_DISTRIBUTION_APP_PRIVATE_KEY }}
