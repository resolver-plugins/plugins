name: Self-hosted FreeBSD builder
description: >-
  Run a script in a copy of the workspace on the self-hosted FreeBSD builder of a
  release, then shut the builder down and restore its baseline.
inputs:
  release:
    description: FreeBSD release (X.Y) of the builder
    required: true
  envs:
    description: Space-separated names of environment variables exported to the script
    default: ''
  run:
    description: Script run with sh in the guest's copy of the workspace
    required: true
  copyback:
    description: Copy the guest's workspace back after the script succeeds
    default: 'false'
runs:
  using: composite
  steps:
    - name: Start the builder
      id: builder
      shell: sh
      env:
        RP_VM_RELEASE: ${{ inputs.release }}
      run: |
        case $RP_VM_RELEASE in
          14.3) series=26.1 ;;
          15.1) series=26.7 ;;
          *) echo "::error::No self-hosted builder runs FreeBSD $RP_VM_RELEASE"; exit 1 ;;
        esac
        echo "series=$series" >> "$GITHUB_OUTPUT"
        python3 "$HOME/builderctl.py" reset "$series"

    - name: Run the script
      shell: sh
      env:
        RP_VM_SERIES: ${{ steps.builder.outputs.series }}
        RP_VM_ENVS: ${{ inputs.envs }}
        RP_VM_RUN: ${{ inputs.run }}
        RP_VM_COPYBACK: ${{ inputs.copyback }}
      run: |
        set -eu
        guest() { python3 "$HOME/builderctl.py" exec "$RP_VM_SERIES" -- "$@"; }
        script="$RUNNER_TEMP/freebsd-builder.sh"
        trap 'rm -f "$script"' EXIT
        install -m 600 /dev/null "$script"
        (
          for name in $RP_VM_ENVS; do
            case $name in [!A-Za-z_]*|*[!A-Za-z0-9_]*) echo "::error::Invalid variable name $name"; exit 1 ;; esac
            eval "value=\${$name-}"
            printf "export %s='%s'\n" "$name" "$(printf '%s' "$value" | sed "s/'/'\\\\''/g")"
          done
          printf 'cd /var/tmp/workspace\n%s\n' "$RP_VM_RUN"
        ) >> "$script"
        tar -cf - . | guest sh -c 'mkdir /var/tmp/workspace && tar -xf - --no-same-owner -C /var/tmp/workspace'
        guest sh -c 'umask 077 && cat > /var/tmp/run.sh' < "$script"
        guest sh /var/tmp/run.sh < /dev/null
        if [ "$RP_VM_COPYBACK" = true ]; then
          guest tar -cf - -C /var/tmp/workspace . | tar -xf -
        fi

    - name: Restore the builder baseline
      if: always() && steps.builder.outputs.series != ''
      shell: sh
      env:
        RP_VM_SERIES: ${{ steps.builder.outputs.series }}
      run: python3 "$HOME/builderctl.py" clean "$RP_VM_SERIES"
