name: Test HA DHCP release source

on:
  pull_request:
    paths:
      - 'net/dhcp-interface-ha/**'
      - 'Mk/**'
      - 'Scripts/**'
      - 'Templates/**'
      - '.github/workflows/ha-dhcp-interface-tests.yml'

permissions:
  contents: read

jobs:
  test:
    uses: resolver-plugins/plugins/.github/workflows/ha-dhcp-interface-tests.yml@master
    with:
      pull_request_base: ${{ github.event.pull_request.base.ref }}
      pull_request_sha: ${{ github.sha }}
    permissions:
      contents: read
